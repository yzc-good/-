<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>英语翻译助手 · English Translator</title>
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="lib/jszip/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1e2430; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eef4ff; --line:#e5e9f0;
  --en:#1f2937; --zh:#b45309; --hl:#fff7e6; --ok:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
header{background:linear-gradient(120deg,#1d4ed8,#2563eb);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
header .logo{font-size:26px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:2px}
.header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.28)}
main{padding:22px 28px;display:flex;gap:20px;align-items:flex-start}
.left{flex:1;min-width:0}
.right{width:340px;position:sticky;top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:#fafbfe}
.toolbar label{font-size:12px;color:var(--muted);margin-right:4px}
.toolbar select,.toolbar input[type=file],.toolbar button{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.toolbar button.primary{background:var(--accent);color:#fff;border:none;font-weight:600}
.toolbar .spacer{flex:1}
.body{padding:18px}
.entry{margin-bottom:26px;border-bottom:1px dashed var(--line);padding-bottom:18px}
.entry:last-child{border-bottom:none}
.en{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.zh{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
/* 中→英：第一行中文原文（无底色），第二行英文译文（黄底，单词仍可点击查词） */
.src-zh{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.tr{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
.tr.pending{color:#b45309;opacity:.75;font-style:italic}
.word{color:#1d4ed8;cursor:pointer;border-radius:3px;transition:background .1s;padding:0 1px}
.word:hover{background:#dbeafe}
.word.active{background:#fde68a}
.legend{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.legend b{font-weight:600}
/* dictionary panel */
.dict-panel h3{font-size:15px;padding:14px;background:var(--accent-soft);color:var(--accent);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dict-body{padding:0;max-height:70vh;overflow:auto}
.dict-empty{padding:28px 18px;color:var(--muted);font-size:13px;text-align:center}
.dict-card{padding:16px;border-bottom:1px solid var(--line)}
.dict-card.hit{background:#fffbeb}
.dword{font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.dipa{font-size:14px;color:var(--muted);font-weight:400}
.dpos{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 8px;margin:8px 0 6px}
.dmean{font-size:14.5px;line-height:1.6;color:var(--ink)}
.dpos2{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.dmean .e{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.dex{font-size:13px;color:var(--ok);background:#f0fdf4;border-radius:6px;padding:7px 10px;margin-top:10px;line-height:1.5}
.dsyn{margin-top:9px;font-size:12.5px;color:var(--muted)}
.dsyn b{color:var(--ink)}
.dnotes{font-size:12.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.dfunc{font-size:13.5px;color:var(--ink);line-height:1.6}
.status{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);background:#fafbfe}
.loading{text-align:center;color:var(--muted);padding:30px}
.copy-btn{cursor:pointer}
/* 顶部状态横幅 */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 22px;font-size:14px;line-height:1.65;border-bottom:1px solid rgba(0,0,0,.07)}
.banner[hidden]{display:none}
.banner .ico{font-size:16px;line-height:1.4}
.banner .msg{flex:1;min-width:0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.banner button{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;cursor:pointer}
.banner button.pri{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}
.banner .x{margin-left:auto;cursor:pointer;opacity:.5;font-size:16px;line-height:1;background:none;border:none;padding:0 4px}
.banner.ok{background:#ecfdf5;color:#065f46;border-bottom-color:#a7f3d0}
.banner.warn{background:#fffbeb;color:#92400e;border-bottom-color:#fde68a}
.banner.err{background:#fef2f2;color:#991b1b;border-bottom-color:#fecaca}
.banner.info{background:#eff6ff;color:#1e40af;border-bottom-color:#bfdbfe}
.banner code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;font-size:12.5px}
.zh.pending{color:#b45309;opacity:.75;font-style:italic}
/* 未收录词条的兜底按钮 */
a.linkbtn,button.linkbtn{display:inline-block;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;cursor:pointer;text-decoration:none}
a.linkbtn:hover,button.linkbtn:hover{background:#e0e7ff}
.dmiss{color:#6b7280;font-size:13.5px;line-height:1.7;margin-top:6px}
.dmiss b{color:#b45309}
@media(max-width:820px){
  main{flex-direction:column}
  .right{width:100%;position:static}
}
@media(max-width:900px){
  header{padding:14px 16px}
  main{padding:14px}
}
@media(max-width:600px){
  .body{padding:12px}
  .en{font-size:16px}
  .zh{font-size:15px}
  .toolbar{padding:10px 12px}
  .entry{margin-bottom:18px}
}
/* 平板横屏/大屏微调 */
@media(min-width:821px) and (max-width:1100px){
  .right{width:300px}
}
/* 触控优化：词条点击区域更友好 */
@media(pointer:coarse){
  .word{padding:1px 3px;border-radius:5px}
  button,.btn,a.linkbtn,button.linkbtn,.toolbar button{padding:10px 14px}
}
</style>
</head>
<body>

<header>
  <div class="logo">🈶</div>
  <div>
    <h1>英语翻译助手</h1>
    <p>中英双向互译 · 逐行对照 · 点击取词 · 本地离线可用</p>
  </div>
  <div class="header-right">
    <button class="btn" id="updateBtn" title="检查更新">🔄 更新</button>
    <button class="btn" onclick="window.print()">🖨 打印</button>
  </div>
</header>

<div class="banner info" id="banner" hidden>
  <span class="ico" id="bannerIco">ℹ️</span>
  <div class="msg" id="bannerMsg"></div>
  <button class="x" onclick="hideBanner()" title="关闭">✕</button>
</div>

<main>
  <div class="left">
    <div class="card">
      <div class="toolbar">
        <label>导入文档</label>
        <input type="file" id="fileInput" accept=".txt,.md,.html,.pdf,.docx,.doc,application/pdf" title="支持中文或英文文档，自动识别方向">
        <button class="primary" onclick="loadBundled()">📄 载入内置文档</button>
        <div class="spacer"></div>
        <label><input type="checkbox" id="autoTr" style="vertical-align:middle"> 导入时联网自动翻译</label>
        <label>取词方式</label>
        <select id="modeSel" onchange="setMode(this.value)">
          <option value="click">点击取词</option>
          <option value="hover">悬停取词</option>
        </select>
      </div>
      <div class="body" id="content">
        <div class="loading">正在加载…</div>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <aside class="right">
    <div class="card dict-panel">
      <h3>📖 词典 · 点击下方英文单词查看释义</h3>
      <div class="dict-body" id="dictBody">
        <div class="dict-empty">点击左侧任意英文单词，这里会显示它在牛津词典中的释义。</div>
      </div>
      <div class="status">词库内置本篇所有关键词；任意单词点击均会尽力解析。</div>
    </div>
  </aside>
</main>

<script>
/*__DATA__*/

const DATA = window.APP_DATA;
const dictBody = document.getElementById('dictBody');
const content = document.getElementById('content');
const status = document.getElementById('status');

// ---------- data lookup ----------
function normKey(w){ return w.toLowerCase(); }

function lookup(word){
  // try several normalized forms of the word
  const candidates = forms(word);
  for(const c of candidates){
    const k = normKey(c.w);
    let res = lookupOne(k, c.w);
    if(res && res.entry) return res;
  }
  return null;
}

// generate candidate (raw word, normalized key) forms
function forms(word){
  let w = word.trim();
  const out = [{w:w, note:''}];
  // possessive 's / s' 
  if(/'\w*$/.test(w)){
    out.push({w: w.replace(/'s$/,''), note:'〔所有格 -\'s〕'});
    out.push({w: w.replace(/'$/, ''), note:'〔-s\' 复数所有格〕'});
    out.push({w: w.replace(/s'$/,'s'), note:''});
  }
  // contractions: don't -> do not, can't -> can, won't -> will, it's -> it is
  const c1 = {
    "don't":"do not","can't":"can not","won't":"will not","shan't":"shall not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "hasn't":"has not","haven't":"have not","hadn't":"had not",
    "doesn't":"does not","didn't":"did not","it's":"it is","that's":"that is",
    "there's":"there is","i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would",
    "we're":"we are","we've":"we have","we'll":"we will","you're":"you are",
    "you've":"you have","you'll":"you will","they're":"they are","they've":"they have",
    "he's":"he is","she's":"she is","who's":"who is","what's":"what is",
    "let's":"let us","wouldn't":"would not","couldn't":"could not",
    "shouldn't":"should not","mustn't":"must not",
  };
  const lk = normKey(w);
  if(c1[lk]){ out.push({w: c1[lk], note:'〔缩写 '+w+' → '+c1[lk]+'〕'}); }
  return out;
}

function lookupOne(k, word){
  // direct
  if(DATA.dictionary[k]) {
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k]));
    e.headword = word + (normKey(word)!==k && /^[a-z]/i.test(word) && word.toLowerCase()!==k && !DATA.dictionary[normKey(word)] ? '（' + e.headword + '）' : '');
    return {entry:e, word};
  }
  // function word
  if(DATA.funcWords && DATA.funcWords[k]) {
    return {entry:{headword:word, ipa:'', pos:[],
      meanings:[{zh:DATA.funcWords[k], en:''}],
      example:'', notes:'常用功能词 / function word'}, word};
  }
  // inflection -> base
  if(DATA.inflect && DATA.inflect[k]) {
    const base = DATA.inflect[k];
    if(DATA.dictionary[base]){
      const e = JSON.parse(JSON.stringify(DATA.dictionary[base]));
      e.headword = word + '（' + e.headword + '）';
      return {entry:e, word};
    }
    if(DATA.funcWords[base]){
      return {entry:{headword:word+'（'+base+'）', ipa:'', pos:[],
        meanings:[{zh:DATA.funcWords[base], en:''}], example:'', notes:'常用词'}, word};
    }
  }
  // trivial depluralize
  if(k.endsWith('s') && DATA.dictionary[k.slice(0,-1)]){
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k.slice(0,-1)]));
    e.headword = word + '（' + e.headword + '）';
    return {entry:e, word};
  }
  return {entry:null, word};
}

// render dictionary entry
function renderDict(entry, word){
  if(!entry){
    const w = String(word || '').trim();
    const q = encodeURIComponent(w.toLowerCase());
    dictBody.innerHTML =
      '<div class="dict-card hit">' +
        '<div class="dword">' + esc(w) + '</div>' +
        '<div class="dmiss">本地词库暂未收录 <b>' + esc(w) + '</b>。<br>可点下面按钮在线查询：</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
          '<button class="linkbtn" id="wordOnlineBtn">🌐 联网查词（多义）</button>' +
          '<a class="linkbtn" target="_blank" rel="noopener" ' +
             'href="https://www.bing.com/dict/search?q=' + q + '">🔎 必应词典</a>' +
          '<a class="linkbtn" target="_blank" rel="noopener" ' +
             'href="https://www.bing.com/search?q=' + q + '+%E6%98%AF%E4%BB%80%E4%B9%88%E6%84%8F%E6%80%9D">🔍 必应搜索</a>' +
          '<a class="linkbtn" target="_blank" rel="noopener" ' +
             'href="https://www.oxfordlearnersdictionaries.com/definition/english/' + q + '">📖 牛津</a>' +
        '</div>' +
        '<div class="dex" id="wordOnlineOut" style="display:none"></div>' +
      '</div>';
    const btn = dictBody.querySelector('#wordOnlineBtn');
    if(btn) btn.addEventListener('click', function(){ wordOnline(w); });
    return;
  }
  let hits = 0;
  let html = '<div class="dict-card hit">';
  html += '<div class="dword">'+esc(entry.headword)+' <span class="dipa">'+esc(entry.ipa||'')+'</span></div>';
  (entry.pos||[]).forEach(p=>{ if(p) html += '<span class="dpos">'+esc(p)+'</span>'; });
  (entry.meanings||[]).forEach(m=>{
    if(m.pos){
      html += '<div class="dmean"><span class="dpos2">'+esc(m.pos)+'</span>'+esc(m.zh)+(m.en?'<span class="e">'+esc(m.en)+'</span>':'')+'</div>';
    } else {
      html += '<div class="dmean">'+esc(m.zh)+(m.en?'<span class="e">'+esc(m.en)+'</span>':'')+'</div>';
    }
  });
  if(entry.example) html += '<div class="dex">✎ '+esc(entry.example)+'</div>';
  if(entry.syn) html += '<div class="dsyn"><b>同义词</b> '+entry.syn.map(esc).join(', ')+'</div>';
  if(entry.ant) html += '<div class="dsyn"><b>反义词</b> '+entry.ant.map(esc).join(', ')+'</div>';
  if(entry.notes) html += '<div class="dnotes">💡 '+esc(entry.notes)+'</div>';
  html += '</div>';
  dictBody.innerHTML = html;
}

// 点击/悬停取词入口：拆分 lookup() 的返回值，把 entry 交给 renderDict
function showWord(word){
  const res = lookup(word);
  renderDict(res ? res.entry : null, word);
}

// 未收录词的联网翻译（需要本地服务）
async function wordOnline(word){
  const out = document.getElementById('wordOnlineOut');
  if(!out) return;
  out.style.display = 'block';
  out.textContent = '正在联网查询「' + word + '」的各词义…';
  const ok = await checkBackend();
  if(!ok){
    out.innerHTML = '未连接本地服务，无法联网翻译。请用 <b>启动工具(双击).bat</b> 以「本地服务」方式打开后再试。';
    return;
  }
  try{
    const r = await fetchWithTimeout(SERVER_BASE + '/api/word?w=' + encodeURIComponent(word), {}, 20000);
    const d = await r.json();
    if(d && d.ok && d.senses && d.senses.length){
      let h = '<div class="dword">'+esc(word)+
              '<span class="dipa">'+esc(d.ipa||'')+'</span></div>';
      let i=0;
      d.senses.forEach(s=>{
        i++;
        let row = '<div class="dmean">';
        if(s.pos) row += '<span class="dpos2">'+esc(s.pos)+'</span> ';
        if(s.zh)  row += esc(s.zh);
        if(s.en)  row += (s.zh?' <span class="e">':'<span class="e">') + esc(s.en)+'</span>';
        row += '</div>';
        h += row;
      });
      if(i===0) h += '<div class="dmiss">未获取到中文释义，可点「牛津在线词典」查看。';
      out.innerHTML = h;
    } else {
      out.textContent = '联网翻译未返回结果，可点「牛津在线词典」查看英文释义。';
    }
  }catch(e){
    out.textContent = '联网查询失败：' + e.message;
  }
}

function esc(s){ 
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- 渲染双语（支持 英→中 / 中→英） ----------
let currentWords = [];
let currentEntries = [];

// 判断一段文本的主语言方向
function detectDir(s){
  const t = String(s || '');
  const cjk = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
  const lat = (t.match(/[A-Za-z]/g) || []).length;
  if(cjk === 0) return 'en2zh';
  if(lat === 0) return 'zh2en';
  // 一个汉字承载的信息量约等于两个拉丁字母
  return (cjk * 2 >= lat) ? 'zh2en' : 'en2zh';
}

// 给 root 内所有英文单词绑定取词事件（可重复调用，不会重复绑定）
function bindWordClicks(root){
  root.querySelectorAll('.word').forEach(w=>{
    if(w.dataset.bound === '1') return;
    w.dataset.bound = '1';
    currentWords.push({el:w, word:w.textContent});
    w.addEventListener('click', function(e){
      e.stopPropagation();
      showWord(this.textContent);
      root.querySelectorAll('.word').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
    });
    w.addEventListener('mouseenter', function(){
      if(mode === 'hover'){
        root.querySelectorAll('.word').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        showWord(this.textContent);
      }
    });
  });
}

// 更新第 idx 条的译文（自动适配方向）
function updateTr(idx, text){
  const el = content.querySelector('[data-tr="'+idx+'"]');
  if(!el) return;
  el.classList.remove('pending');
  const e = currentEntries[idx];
  if(e && (e.dir || 'en2zh') === 'zh2en'){
    el.innerHTML = tokenize(text);
    bindWordClicks(el);
  } else {
    el.textContent = text;
  }
}

function renderBilingual(entries){
  currentWords = [];
  currentEntries = entries || [];
  let html = '<div class="legend"><span><b>说明</b></span>'+
    '<span>第一行 = 原文</span><span>🟨 黄色 = 译文</span>'+
    '<span>■ 蓝色英文单词 = 可点击取词</span></div>';
  currentEntries.forEach((seg, idx)=>{
    const d = seg.dir || 'en2zh';
    html += '<div class="entry" data-i="'+idx+'">';
    if(d === 'zh2en'){
      html += '<div class="src-zh">'+esc(seg.zh || '')+'</div>';
      html += '<div class="tr'+(seg.en ? '' : ' pending')+'" data-tr="'+idx+'">'+
              (seg.en ? tokenize(seg.en) : '（待翻译）')+'</div>';
    } else {
      html += '<div class="en">'+tokenize(seg.en || '')+'</div>';
      html += '<div class="tr'+(seg.zh ? '' : ' pending')+'" data-tr="'+idx+'">'+
              (seg.zh ? esc(seg.zh) : '（待翻译）')+'</div>';
    }
    html += '</div>';
  });
  content.innerHTML = html;
  bindWordClicks(content);
  const all = [];
  all.forEach(w=>{
    currentWords.push({el:w, word:w.textContent});
    w.addEventListener('click', function(e){
      e.stopPropagation();
      showWord(this.textContent);
      // highlight
      all.forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
    });
    w.addEventListener('mouseenter', function(){
      if(mode==='hover'){ 
        all.forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        showWord(this.textContent);
      }
    });
  });
}

let mode = 'click';
function setMode(m){
  mode = m;
  status.textContent = '取词方式已切换为：' + (m==='click'?'点击取词':'悬停取词');
}

function tokenize(text){
  // split into word / non-word tokens
  const parts = text.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g);
  let out = '';
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    if(!p) continue;

      out += '<span class="word" data-w="'+esc(normKey(p))+'">'+esc(p)+'</span>';
    } else {
      out += esc(p);
    }
  }
  return out;
}

function fetchWithTimeout(url, opts, ms){
  return new Promise((resolve, reject)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); reject(new Error('请求超时（'+Math.round(ms/1000)+'秒）')); }, ms);
    fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
      .then(r=>{ clearTimeout(timer); resolve(r); })
      .catch(e=>{ clearTimeout(timer); reject(e); });
  });
}

    const chunk = entries.slice(i, i+BATCH);
    try{
      const resp = await fetchWithTimeout(SERVER_BASE + '/api/translate-lines', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({lines: chunk.map(e=>e.en)})
      }, 40000);

      if(data && data.ok && Array.isArray(data.zh)){
        data.zh.forEach((z,k)=>{

    }catch(err){

// 数据全部内置，PDF/DOCX 在设备本地用 js 解析，联网查询直接访问在线接口。

// ================= 网络层：优先走 Capacitor 原生 HTTP（不受 CORS 限制） =================
function capBridge(){ return (window.Capacitor || null); }

// GET -> {status, text}；失败抛错
async function httpGet(url, headers, ms){
  const timeout = ms || 15000;
  const cap = capBridge();

  // 1) 直接用桥接的 nativePromise 调 CapacitorHttp（最稳，完全绕过 WebView 的 CORS）
  if(cap && typeof cap.nativePromise === 'function'){
    try{
      const res = await cap.nativePromise('CapacitorHttp', 'request', {
        url: url,
        method: 'GET',
        headers: headers || {},
        connectTimeout: 12000,
        readTimeout: timeout,
        responseType: 'text'
      });
      if(res && (res.status === 0 || res.status)){
        let data = res.data;
        if(data && typeof data === 'object') data = JSON.stringify(data);
        return {status: res.status || 0, text: String(data == null ? '' : data)};
      }
    }catch(e){ /* 落到下一层 */ }
  }

  // 2) 若已注册 CapacitorHttp 插件对象
  if(cap && cap.Plugins && cap.Plugins.CapacitorHttp){
    try{
      const res = await cap.Plugins.CapacitorHttp.get({
        url: url, headers: headers || {},
        connectTimeout: 12000, readTimeout: timeout
      });
      let data = res ? res.data : '';
      if(data && typeof data === 'object') data = JSON.stringify(data);
      return {status: (res && res.status) || 0, text: String(data == null ? '' : data)};
    }catch(e){ /* 落到下一层 */ }
  }

  // 3) 普通浏览器 / 已被 native-bridge 打补丁的 fetch
  const r = await fetchWithTimeout(url, {headers: headers || {}, cache: 'no-store'}, timeout);
  return {status: r.status, text: await r.text()};
}

async function httpJson(url, headers, ms){
  const r = await httpGet(url, headers, ms);
  if(r.status && r.status >= 400) throw new Error('HTTP '+r.status);
  try{ return JSON.parse(r.text); }
  catch(e){ throw new Error('返回内容不是 JSON'); }
}

// POST（表单）-> {status, text}；用于有道整句翻译接口
async function httpPost(url, body, headers, ms){
  const timeout = ms || 15000;
  const hdr = Object.assign({'Content-Type':'application/x-www-form-urlencoded'}, headers || {});
  const cap = capBridge();

  // 1) 原生通道（不受 CORS 限制）
  if(cap && typeof cap.nativePromise === 'function'){
    try{
      const res = await cap.nativePromise('CapacitorHttp', 'request', {
        url: url,
        method: 'POST',
        headers: hdr,
        data: body,
        connectTimeout: 12000,
        readTimeout: timeout,
        responseType: 'text'
      });
      if(res && (res.status === 0 || res.status)){
        let data = res.data;
        if(data && typeof data === 'object') data = JSON.stringify(data);
        return {status: res.status || 0, text: String(data == null ? '' : data)};
      }
    }catch(e){ /* 落到下一层 */ }
  }

  // 2) 普通 fetch
  const r = await fetchWithTimeout(url, {
    method:'POST', headers: hdr, body: body, cache:'no-store'
  }, timeout);
  return {status: r.status, text: await r.text()};
}

async function httpPostJson(url, body, headers, ms){
  const r = await httpPost(url, body, headers, ms);
  if(r.status && r.status >= 400) throw new Error('HTTP '+r.status);
  try{ return JSON.parse(r.text); }
  catch(e){ throw new Error('返回内容不是 JSON'); }
}

const YOUDAO_HEADERS = {
  'User-Agent':'Mozilla/5.0 (Linux; Android 12; HarmonyOS) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36',
  'Referer':'https://dict.youdao.com/',
  'Accept':'application/json,text/plain,*/*'
};

// 把有道 jsonapi 的 ec.word 解析成多义词
function parseJsonapiSenses(j){
  const strip = s => String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\u200b/g,'').trim();
  const ec = j && j.ec;
  if(!ec || !Array.isArray(ec.word) || !ec.word.length) return null;
  const w0 = ec.word[0];
  const ipa = strip(w0.phonetic) || strip(w0.usphone) || strip(w0.ukphone);
  let senses = [], seen = {};
  const POS_RE = /^((?:[A-Za-z]{1,6}\.)+)\s*(.*)$/;
  const push = (pos, zh) => {
    zh = strip(zh);
    if(!zh) return;
    if(zh.includes('【') || zh.includes('人名')) return;   // 过滤"（人名）"等噪声
    const key = (pos||'') + '|' + zh;
    if(seen[key]) return;
    seen[key] = 1;
    senses.push({pos:strip(pos||''), zh:zh, en:'', ex:''});
  };
  (w0.trs||[]).forEach(tr=> (tr.tr||[]).forEach(it=>{
    let phrase = (it.l||{}).i || [];
    if(Array.isArray(phrase)) phrase = phrase.join(' ');
    const text = strip(phrase);
    const m = text.match(POS_RE);
    if(m) push(m[1], m[2]); else push('', text);
  }));
  if(!senses.length) return null;
  return {ipa:ipa, senses:senses.slice(0,10)};
}

// 解析 suggest 的指定词条（explain 形如 "n. 银行；岸"）
function parseSuggestEntry(entry){
  const strip = s => String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\u200b/g,'').trim();
  const text = strip(entry && entry.explain);
  if(!text) return null;
  let senses = [], seen = {};
  const POS_RE = /((?:[A-Za-z]{1,6}\.)+)\s*/g;
  // 按 "n. / v. / adj." 之类的词性标记切段
  const marks = [];
  let m;
  while((m = POS_RE.exec(text)) !== null){
    marks.push({pos:m[1], start:m.index, end:POS_RE.lastIndex});
  }
  if(!marks.length){
    return {ipa:'', senses:[{pos:'', zh:text, en:'', ex:''}]};
  }
  // 第一段（词性标记之前若有内容）
  if(marks[0].start > 0){
    const head = text.slice(0, marks[0].start).replace(/[;；,，]\s*$/,'').trim();
    if(head) senses.push({pos:'', zh:head, en:'', ex:''});
  }
  marks.forEach((mk, i)=>{
    const stop = (i+1 < marks.length) ? marks[i+1].start : text.length;
    let body = text.slice(mk.end, stop).replace(/[;；]\s*$/,'').trim();
    body = body.replace(/^(?:<[^>]+>)+/,'').trim();
    if(!body) return;
    const key = mk.pos + '|' + body;
    if(seen[key]) return;
    seen[key] = 1;
    senses.push({pos:mk.pos, zh:body, en:'', ex:''});
  });
  return senses.length ? {ipa:'', senses:senses.slice(0,10)} : null;
}

// 有道多义词：jsonapi 优先；suggest 只接受"完全同名"的词条，避免张冠李戴
async function fetchYoudao(word){
  const q = encodeURIComponent(word);
  const lw = String(word).trim().toLowerCase();

  // 1) jsonapi —— 释义最全
  try{
    const j = await httpJson('https://dict.youdao.com/jsonapi?q=' + q, YOUDAO_HEADERS, 12000);
    const r = parseJsonapiSenses(j);
    if(r) return r;
  }catch(e){}

  // 2) suggest —— 必须 entry === 查询词，否则会返回 campaign/chamber 之类的近似词
  try{
    const j = await httpJson('https://dict.youdao.com/suggest?num=10&doctype=json&q=' + q, YOUDAO_HEADERS, 12000);
    const ent = (j && j.data && j.data.entries) || [];
    for(const e of ent){
      if(e && String(e.entry || '').trim().toLowerCase() === lw){
        const r = parseSuggestEntry(e);
        if(r) return r;
      }
    }
  }catch(e){}

  return null;
}

// 英文释义兜底（dictionaryapi.dev）
async function fetchEnglishDefs(word){
  try{
    const j = await httpJson('https://api.dictionaryapi.dev/api/v2/entries/en/' +
      encodeURIComponent(word), {'Accept':'application/json'}, 10000);
    if(!Array.isArray(j)) return null;
    const out = [];
    j.slice(0,2).forEach(entry=>{
      (entry.meanings||[]).slice(0,3).forEach(m=>{

}

// --- 整句/整词翻译：MyMemory（带重试）-> Google gtx 兜底 ---
// --- 段落翻译（双向）：MyMemory（带重试）-> Google gtx 兜底 ---
async function fetchTranslate(text, dir){
  const isZ2E = (dir === 'zh2en');
  const src = String(text || '').trim();
  if(!src) return '';

  // 长句按 URL 编码后的长度切分（MyMemory 对 q 有长度限制，中文尤其容易超）
  const parts = chunkByEncodedLen(src, 450);
  if(parts.length > 1){
    const outs = [];
    for(const p of parts){
      const r = await translateOne(p, isZ2E);
      if(!r) return '';
      outs.push(r);
      await new Promise(r2=>setTimeout(r2, 120));
    }
    // 中文译文不加空格，英文译文用空格连接
    return isZ2E ? outs.join(' ') : outs.join('');
  }
  return translateOne(src, isZ2E);
}

// 按 URL 编码后的长度切分文本，尽量在句末切开
function chunkByEncodedLen(text, budget){
  const enc = s => encodeURIComponent(s).length;
  if(enc(text) <= budget) return [text];
  const parts = text.split(/(?<=[。！？；.!?;])\s*/).filter(Boolean);
  const out = [];
  let buf = '';
  for(const p of parts){
    if(buf && enc(buf + p) > budget){ out.push(buf); buf = p; }
    else buf += p;
  }
  if(buf) out.push(buf);
  // 仍然超长的再硬切
  const final = [];
  for(const s of out){
    if(enc(s) <= budget){ final.push(s); continue; }
    let acc = '';
    for(const ch of s){
      if(acc && enc(acc + ch) > budget){ final.push(acc); acc = ch; }
      else acc += ch;
    }
    if(acc) final.push(acc);
  }
  return final;
}

// 最近一次翻译失败的原因（用于给用户看提示）
let lastTranslateError = '';

// --- 有道整句翻译（国内直连、无需密钥，作为首选）---
// POST https://aidemo.youdao.com/trans  q/from/to -> {errorCode:0, translation:[...]}
async function translateByYoudao(text, isZ2E){
  const body = 'q=' + encodeURIComponent(text)
             + '&from=' + (isZ2E ? 'zh-CHS' : 'en')
             + '&to='   + (isZ2E ? 'en' : 'zh-CHS');
  const j = await httpPostJson('https://aidemo.youdao.com/trans', body,
      {'User-Agent': YOUDAO_HEADERS['User-Agent'], 'Referer': 'https://fanyi.youdao.com/'}, 15000);
  if(!j) throw new Error('空响应');
  // 注意：接口返回的 errorCode 是字符串 "0"，必须用 Number() 比较
  const code = j.errorCode;
  if(code !== undefined && code !== null && Number(code) !== 0) throw new Error('errorCode ' + code);
  const arr = j.translation;
  return (Array.isArray(arr) ? arr.join('') : String(arr || '')).trim();
}

// --- MyMemory（免费；按 IP 有每日额度，超了返回 429）---
async function translateByMyMemory(text, isZ2E){
  const clean = s => String(s||'')
      .replace(/\s*[\[【「].*$/,'')
      .replace(/MYMEMORY[\s\S]*$/,'')
      .replace(/\s+/g,' ').trim();
  const pair = isZ2E ? 'zh-CN|en' : 'en|zh-CN';
  const q = encodeURIComponent(text);
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const j = await httpJson('https://api.mymemory.translated.net/get?q=' + q + '&langpair=' + pair,
        {'Accept':'application/json'}, 12000);
      return clean((j.responseData||{}).translatedText);
    }catch(e){
      lastErr = e;
      if(attempt === 0){ await new Promise(r=>setTimeout(r, 600)); }
    }
  }
  throw lastErr || new Error('无结果');
}

// --- Google gtx（海外可用，国内通常被墙）---
async function translateByGoogle(text, isZ2E){
  const sl = isZ2E ? 'zh-CN' : 'en';
  const tl = isZ2E ? 'en' : 'zh-CN';
  const j = await httpJson('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q=' + encodeURIComponent(text),
    {}, 12000);
  const out = (Array.isArray(j) && Array.isArray(j[0])) ? j[0].map(x=>(x&&x[0])||'').join('') : '';
  return String(out || '').replace(/\s+/g,' ').trim();
}

// 依次尝试多个通道，返回第一个通过校验的译文
async function translateOne(text, isZ2E){
  // 译文有效性：英→中要求含汉字；中→英要求含英文单词且基本不含汉字
  const valid = s => isZ2E
      ? (/[A-Za-z]{2,}/.test(s) && !/[\u4e00-\u9fff]/.test(s))
      : /[\u4e00-\u9fff]/.test(s);

  const chain = [
    ['有道',     () => translateByYoudao(text, isZ2E)],
    ['MyMemory', () => translateByMyMemory(text, isZ2E)],
    ['Google',   () => translateByGoogle(text, isZ2E)],
  ];
  const errors = [];
  for(const item of chain){
    try{
      const t = await item[1]();
      if(t && valid(t)) return t;
      errors.push(item[0] + ': 结果无效');
    }catch(e){
      errors.push(item[0] + ': ' + String((e && e.message) || e).slice(0, 40));
    }
  }
  lastTranslateError = errors.join('；');
  return '';
}

// 把失败原因翻译成人话，便于用户判断该等一等还是查网络
function translateFailHint(){
  const e = lastTranslateError || '';
  if(/429|Too Many/i.test(e)) return '翻译接口今日免费额度已用完，请明天再试（或换个网络）。';
  if(/timeout|timed out|超时|abort/i.test(e)) return '翻译接口超时，请检查网络后重试。';
  if(/errorCode|空响应|HTTP 4|HTTP 5/i.test(e)) return '翻译接口暂时不可用，请稍后重试。';
  return '联网翻译失败' + (e ? '（' + e + '）' : '') + '，仅显示原文。';
}

// --- 逐批翻译（小批 + 间隔，避免被限流；支持双向） ---
function srcOf(e){ return (e.dir === 'zh2en') ? (e.zh || '') : (e.en || ''); }
function setTrans(e, t){ if(e.dir === 'zh2en') e.en = t; else e.zh = t; }

function translateEntries(entries){
  const BATCH = 3;
  let done = 0;
  return (async function run(){
    for(let i=0; i<entries.length; i+=BATCH){
      const chunk = entries.slice(i, i+BATCH);
      try{
        const arr = await Promise.all(chunk.map(e=> fetchTranslate(srcOf(e), e.dir || 'en2zh')));
        arr.forEach((t,k)=>{
          if(t){ setTrans(entries[i+k], t); updateTr(i+k, t); done++; }
        });
      }catch(e){ /* 单批失败不影响后续 */ }
      // 第一批全失败基本就是没网，直接停，避免长时间空转
      if(i === 0 && done === 0) break;
      if(i + BATCH < entries.length){
        await new Promise(r=>setTimeout(r, 300));
      }
    }
    return done;
  })();
}

// --- 本地解析 PDF（pdf.js） ---
async function extractPdfText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error('pdf.js 未加载');
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const parts = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const lineText = {};
    tc.items.forEach(it=>{
      const str = (it.str||'').replace(/\u00ad/g,'');
      if(!str.trim()) return;
      const y = Math.round(it.transform[5]);
      lineText[y] = (lineText[y]||'') + ' ' + str;
    });
    const pageLines = Object.keys(lineText).sort((a,b)=>b-a).map(k=>lineText[k].trim());
    parts.push(pageLines.join('\n'));
  }
  return parts.join('\n');
}

// --- 本地解析 DOCX（JSZip） ---
async function extractDocxText(arrayBuffer){
  if(!window.JSZip) throw new Error('JSZip 未加载');
  const zip = await JSZip.loadAsync(arrayBuffer);
  const file = zip.file('word/document.xml');
  if(!file) throw new Error('非法 DOCX：缺少 document.xml');
  const xml = await file.async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const paras = [];
  doc.querySelectorAll('w\\:p').forEach(p=>{
    const text = Array.from(p.querySelectorAll('w\\:t')).map(t=>t.textContent).join('').trim();
    if(text) paras.push(text);
  });
  return paras.join('\n');
}

// --- 断句（复用 server 思路，JS 版） ---
const _END_RE = /[.?!。！？]["'”’)]?\s*$/;
const _CUE = new Set(('of the a an to and or but in on at for with that which who whom whose from as by '+
  'is are was were has have had will would can could may might must not very more most this these those their '+
  'its our your his her my no nor so than then while when where').split(' '));
function _shouldJoin(buf, nxt){
  if(_END_RE.test(buf)) return false;
  const ws = buf.match(/[A-Za-z']+/) || [];
  const lastw = (ws[ws.length-1]||'').toLowerCase();
  if(_CUE.has(lastw)) return true;
  const tail = buf.trim().slice(-1);
  if(',;:-–—'.includes(tail)) return true;
  if(!nxt) return false;
  const c = nxt[0];
  if(!/[A-Za-z]/.test(c)) return true;
  if(c===c.toLowerCase() && c!==c.toUpperCase()) return true;
  return false;
}
function splitSentences(text){
  const lines = text.split(/\r?\n/)
    .map(s=>s.trim())
    .filter(s=>s && !/^change\s+times/i.test(s) && !/^\d+$/.test(s)
      && !/粉丝团/.test(s) && !/^\d[\d\s.\-–—|]+$/.test(s) && s.length>1);
  const joined = [];
  let buf='';
  lines.forEach(ln=>{
    if(buf){ if(_shouldJoin(buf,ln)) buf += ' '+ln; else { joined.push(buf); buf=ln; } }
    else buf = ln;
  });
  if(buf) joined.push(buf);
  const out = [];
  joined.forEach(ch=>{
    ch.split(/(?<=[.?!。！？])\s+(?=[A-Z0-9"'“‘(])/).forEach(p=>{
      p=p.trim();
      if(p && /[A-Za-z]{2,}/.test(p) && p.length>=2) out.push(p);
    });
  });
  return out;
}

// 页眉页脚 / 页码等噪声行
function isNoiseLine(ln){
  const t = String(ln || '').trim();
  if(!t) return true;
  if(/^change\s+times/i.test(t) || /粉丝团/.test(t)) return true;                    // 站点水印
  if(/^[\d\s.\-–—|/]+$/.test(t)) return true;                                        // 纯数字、破折号页码
  if(/^第\s*[0-9０-９一二三四五六七八九十百千]+\s*页\s*$/.test(t)) return true;          // 第 3 页
  if(/^page\s*\d+(\s*(of|\/)\s*\d+)?$/i.test(t)) return true;                        // Page 3 of 10
  if(/^\d+\s*\/\s*\d+$/.test(t)) return true;                                        // 3/10
  return false;
}

// --- 纯文本按行切分（中文行按句子再切一刀；英文行保持原样） ---
function entriesFromLines(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(ln=>{
    ln = ln.trim();
    if(isNoiseLine(ln)) return;
    const d = detectDir(ln);
    if(d === 'zh2en'){
      ln.split(/(?<=[。！？；])/).forEach(p=>{
        p = p.trim();
        if(p && /[\u4e00-\u9fff]/.test(p)) out.push({en:'', zh:p, dir:'zh2en'});
      });
    } else if(/[A-Za-z]{2,}/.test(ln)){
      out.push({en:ln, zh:'', dir:'en2zh'});
    }
  });
  return out;
}

// --- 把整篇文本按语言切成块（空行分隔），分别交给对应切分器 ---
function classifyBlocks(text){
  const blocks = [];
  let cur = null;
  String(text || '').split(/\r?\n/).forEach(ln=>{
    const t = ln.trim();
    if(!t){ cur = null; return; }
    if(isNoiseLine(t)) return;          // 页脚不应打断段落合并
    const d = detectDir(t);
    if(!cur || cur.dir !== d){ cur = {dir:d, text:''}; blocks.push(cur); }
    cur.text += (cur.text ? '\n' : '') + t;
  });
  return blocks;
}

// --- 文档（PDF/DOCX）→ 条目：英文沿用换行合并逻辑，中文按句切分 ---
function entriesFromDoc(text){
  const out = [];
  classifyBlocks(text).forEach(b=>{
    if(b.dir === 'zh2en'){
      out.push.apply(out, entriesFromLines(b.text));
    } else {
      splitSentences(b.text).forEach(s=>out.push({en:s, zh:'', dir:'en2zh'}));
    }
  });
  return out;
}

// --- 本地解析+导入任意文档 ---
async function parseAndImport(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  const buf = await file.arrayBuffer();
  let text = '';
  if(ext==='pdf') text = await extractPdfText(buf);
  else if(ext==='docx') text = await extractDocxText(buf);
  else {
    const dec = new TextDecoder('utf-8');
    text = dec.decode(buf);
    return loadTextFile(text, file.name);
  }
  const entries = entriesFromDoc(text);
  if(!entries.length) throw new Error('未能从「'+file.name+'」提取到中文或英文（可能是扫描版/图片型 PDF，需先 OCR）。');
  renderBilingual(entries);
  status.textContent = '已解析「'+file.name+'」：共 '+entries.length+' 句（'+dirSummary(entries)+'）。点击蓝色英文单词可取词。';
  const wantTr = document.getElementById('autoTr') && document.getElementById('autoTr').checked;
  if(wantTr){
    showBanner('info','已导入 '+entries.length+' 句（'+dirSummary(entries)+'），正在后台逐句翻译…');
    const done = await translateEntries(entries);
    showBanner(done>0?'ok':'warn',
      done>0 ? '已翻译 '+done+'/'+entries.length+' 句。':translateFailHint());
  } else {
    showBanner('ok','已导入「'+file.name+'」共 '+entries.length+' 句（'+dirSummary(entries)+'）。<br>勾选「导入时联网自动翻译」可生成译文。');
  }
}

// ===================== 远程更新（内置版本检查 / 热更新） =====================
// 调用原生 UpdateManager 插件。插件把 update.json 从本仓库拉取并处理。
(function(){
  const updateBtn = document.getElementById('updateBtn');
  if(!updateBtn) return;

  // 用一个通用桥接调用原生插件
  async function callPlugin(pluginId, method, opts){
    const cap = capBridge();
    if(!cap || typeof cap.nativePromise !== 'function'){
      throw new Error('当前环境不支持原生插件（非独立 App 或插件未注册）');
    }
    try{
      return await cap.nativePromise(pluginId, method, (opts || {}));
    }catch(err){
      // 原生 reject 过来的可能是 Exception 对象，尽量取出可读信息
      let m = '';
      if(err){
        if(typeof err === 'string') m = err;
        else m = err.message || err.errorMessage || '';
      }
      // Capacitor 有时把 "plugin not implemented" 之类包一层
      if(/not implemented/i.test(m)) m = '更新模块未生效，请安装 v1.3 或更新版本';
      throw new Error(m || '未知错误');
    }
  }

  // 判断是不是"网络不通"类错误，给出更具体的建议
  function netHint(msg){
    if(/所有更新地址都无法访问|timeout|timed out|超时|Unable to resolve host|UnknownHost|ConnectException|SSL/i.test(msg||'')){
      return '<br><span style="opacity:.85">可能原因：当前网络访问 GitHub 受限。'
           + '请换用 Wi-Fi / 手机热点再试；或稍后再点一次。</span>';
    }
    return '';
  }

  async function checkUpdate(showLatest){
    updateBtn.textContent = '检查中…';
    updateBtn.disabled = true;
    try{
      const r = await callPlugin('UpdateManager', 'check', {});
      const state = r && (r.state || 'none');
      const msg = (r && r.message) || '';
      if(state === 'none'){
        showBanner('ok', '🟢 ' + esc(msg) + (r.source ? '　<i style="opacity:.7">（' + esc(r.source) + '）</i>' : ''));
        hideBannerSoon(5000);
      } else {
        // 有更新：提供升级选项
        const acts = [];
        // 网页内容热更新（只要清单里带 files 就允许，重新应用当前版也无害）
        acts.push({label:'仅更新应用内容（热更新）', onClick: applyWebUpdate});
        if(r.hasApk){
          acts.push({label:'下载新版 App（整包安装）', onClick: installAppUpdate});
        }
        if(!acts.length) acts.push({label:'知道了', onClick: hideBanner});
        showBanner('info', '🔵 '+esc(msg)+'<br>请问如何更新？', acts);
      }
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '检查更新失败：'+esc(m)+netHint(m));
    }finally{
      updateBtn.textContent = '🔄 更新';
      updateBtn.disabled = false;
    }
  }

  async function applyWebUpdate(){
    showBanner('info', '正在下载并应用应用内容更新…');
    try{
      const r = await callPlugin('UpdateManager', 'applyWeb', {});
      if(r && r.skipped){
        showBanner('ok', '🟢 已经是当前最新内容（v'+(r.webVersion||'')+'），无需更新。');
        return;
      }
      showBanner('ok', '✅ 应用内容已更新为最新版。');
      setTimeout(()=>{ location.reload(); }, 1500);
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '应用内容更新失败：'+esc(m)+netHint(m));
    }
  }

  async function installAppUpdate(){
    showBanner('info', '正在下载新版 App…下载完成后会弹出系统安装界面。');
    try{
      await callPlugin('UpdateManager', 'installApp', {});
      showBanner('ok', '已开始下载并安装新版 App，请按系统提示操作。');
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '下载新版 App 失败：'+esc(m)+netHint(m));
    }
  }

  function hideBannerSoon(ms){ setTimeout(()=>{ if(bannerEl.className.includes('banner')) hideBanner(); }, ms); }

  updateBtn.addEventListener('click', function(){ checkUpdate(true); });
})();
