<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>英语翻译助手 · English Translator</title>
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="lib/jszip/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1e2430; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eef4ff; --line:#e5e9f0;
  --en:#1f2937; --zh:#b45309; --hl:#fff7e6; --ok:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
header{background:linear-gradient(120deg,#1d4ed8,#2563eb);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
header .logo{font-size:26px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:2px}
.header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.28)}
main{padding:22px 28px;display:flex;gap:20px;align-items:flex-start}
.left{flex:1;min-width:0}
.right{width:340px;position:sticky;top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:#fafbfe}
.toolbar label{font-size:12px;color:var(--muted);margin-right:4px}
.toolbar select,.toolbar input[type=file],.toolbar button{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.toolbar button.primary{background:var(--accent);color:#fff;border:none;font-weight:600}
.toolbar .spacer{flex:1}
.body{padding:18px}
.entry{margin-bottom:26px;border-bottom:1px dashed var(--line);padding-bottom:18px}
.entry:last-child{border-bottom:none}
.en{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.zh{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
/* 中→英：第一行中文原文（无底色），第二行英文译文（黄底，单词仍可点击查词） */
.src-zh{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.tr{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
.tr.pending{color:#b45309;opacity:.75;font-style:italic}
.word{color:#1d4ed8;cursor:pointer;border-radius:3px;transition:background .1s;padding:0 1px}
.word:hover{background:#dbeafe}
.word.active{background:#fde68a}
.legend{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.legend b{font-weight:600}
/* dictionary panel */
.dict-panel h3{font-size:15px;padding:14px;background:var(--accent-soft);color:var(--accent);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
/* 词典内查词：输入英文或中文 */
.dict-search{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto}
.dict-search input{flex:1 1 auto;min-width:0;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafbfe;color:var(--ink)}
.dict-search input:focus{outline:none;border-color:#93c5fd;background:#fff}
.dict-search button{flex:0 0 auto;font-size:13px;padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.dict-search button:active{opacity:.85}
/* 术语在线入口 */
.term-line{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:#f6faf7;flex:0 0 auto}
.term-line button{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border:none;border-radius:8px;background:#15803d;color:#fff;font-weight:600;cursor:pointer}
.term-line button:active{opacity:.85}
.term-line .term-note{font-size:11px;color:#6b7280;line-height:1.4;min-width:0}
@media (max-width:520px){ .term-line{flex-direction:column;align-items:flex-start;gap:4px} }
/* 术语在线权威卡片 */
.termcard{border-left:3px solid #15803d;background:#f7fdf9}
.termcard .dword{color:#14532d}
.termbadge{display:inline-block;font-size:10.5px;color:#15803d;background:#dcfce7;
  border-radius:20px;padding:2px 9px;margin:6px 0 2px}
.dict-body{padding:0;max-height:70vh;overflow:auto}
.dict-empty{padding:28px 18px;color:var(--muted);font-size:13px;text-align:center}
.dict-card{padding:16px;border-bottom:1px solid var(--line)}
.dict-card.hit{background:#fffbeb}
.dword{font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.dipa{font-size:14px;color:var(--muted);font-weight:400}
.dpos{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 8px;margin:8px 0 6px}
.dmean{font-size:14.5px;line-height:1.6;color:var(--ink)}
.dpos2{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.dmean .e{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.dex{font-size:13px;color:var(--ok);background:#f0fdf4;border-radius:6px;padding:7px 10px;margin-top:10px;line-height:1.5}
.dsyn{margin-top:9px;font-size:12.5px;color:var(--muted)}
.dsyn b{color:var(--ink)}
.dnotes{font-size:12.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.dfunc{font-size:13.5px;color:var(--ink);line-height:1.6}
.status{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);background:#fafbfe}
.loading{text-align:center;color:var(--muted);padding:30px}
.copy-btn{cursor:pointer}
/* 顶部状态横幅 */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 22px;font-size:14px;line-height:1.65;border-bottom:1px solid rgba(0,0,0,.07)}
.banner[hidden]{display:none}
.banner .ico{font-size:16px;line-height:1.4}
.banner .msg{flex:1;min-width:0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.banner button{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;cursor:pointer}
.banner button.pri{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}
.banner .x{margin-left:auto;cursor:pointer;opacity:.5;font-size:16px;line-height:1;background:none;border:none;padding:0 4px}
.banner.ok{background:#ecfdf5;color:#065f46;border-bottom-color:#a7f3d0}
.banner.warn{background:#fffbeb;color:#92400e;border-bottom-color:#fde68a}
.banner.err{background:#fef2f2;color:#991b1b;border-bottom-color:#fecaca}
.banner.info{background:#eff6ff;color:#1e40af;border-bottom-color:#bfdbfe}
.banner code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;font-size:12.5px}
.zh.pending{color:#b45309;opacity:.75;font-style:italic}
/* 未收录词条的兜底按钮 */
a.linkbtn,button.linkbtn{display:inline-block;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;cursor:pointer;text-decoration:none}
a.linkbtn:hover,button.linkbtn:hover{background:#e0e7ff}
.dmiss{color:#6b7280;font-size:13.5px;line-height:1.7;margin-top:6px}
.dmiss b{color:#b45309}
/* 抽屉把手与关闭按钮：仅手机竖屏显示 */
.sheet-handle,.sheet-close{display:none}
@media(max-width:820px){
  /* 手机竖屏：词典变成「跟随单词浮动的小窗」
     · 没取词时完全隐藏（opacity:0），不占视野
     · 点词后浮到被点单词的正下方（下方放不下则翻到上方）
     · 默认高度 30% 屏高，释义在窗内滚动 */
  main{display:block}
  .right{
    position:fixed;left:10px;right:10px;width:auto;
    top:0;bottom:auto;
    height:30vh;
    opacity:0;
    transform:translateY(8px) scale(.985);
    transition:opacity .16s ease, transform .16s ease;
    z-index:60;
    pointer-events:none;
  }
  .right.open{opacity:1;transform:none;pointer-events:auto}
  .right .dict-panel{
    height:100%;display:flex;flex-direction:column;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(15,23,42,.24);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .right .dict-body{flex:1 1 auto;max-height:none;overflow:auto;-webkit-overflow-scrolling:touch}
  .right .status{flex:0 0 auto}
  .right .dict-panel h3{flex:0 0 auto}
  /* 顶部拖动条：上滑加高、下滑变矮（拖很短则收起） */
  .sheet-handle{
    display:flex;align-items:center;justify-content:center;
    height:20px;flex:0 0 auto;cursor:grab;
    touch-action:none;background:var(--accent-soft);
    border-bottom:1px solid var(--line);
    border-radius:14px 14px 0 0;
  }
  .sheet-handle span{width:44px;height:5px;border-radius:3px;background:#c7d2fe}
  .sheet-handle:active{cursor:grabbing}
  .sheet-close{
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:auto;width:28px;height:28px;flex:0 0 auto;
    border:none;border-radius:50%;background:#fff;color:var(--accent);
    font-size:14px;line-height:1;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
}
@media(max-width:900px){
  header{padding:14px 16px}
  main{padding:14px}
}
@media(max-width:600px){
  .body{padding:12px}
  .en{font-size:16px}
  .src-zh{font-size:16px}
  .tr{font-size:15px}
  .zh{font-size:15px}
  .toolbar{padding:10px 12px}
  .entry{margin-bottom:18px}
}
/* 平板横屏/大屏微调 */
@media(min-width:821px) and (max-width:1100px){
  .right{width:300px}
}
/* ---------- 听力播放器 ---------- */
.tts-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);background:#f0f7ff}
.tts-btn{font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #bfdbfe;
  background:#fff;color:#1d4ed8;font-weight:600;cursor:pointer;transition:.15s}
.tts-btn:hover:not(:disabled){background:#e0efff}
.tts-btn:disabled{opacity:.45;cursor:default}
.tts-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tts-btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.tts-opt{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.tts-rate{gap:7px}
.tts-rate input[type=range]{width:96px;vertical-align:middle}
.tts-state{font-size:12px;color:#15803d;font-weight:600;margin-left:auto}
/* 正在朗读的句子高亮 */
.entry.tts-active{background:#dbeafe;box-shadow:inset 3px 0 0 var(--accent);
  border-radius:8px;transition:background .15s}
.entry.tts-active .en,.entry.tts-active .src-zh{font-weight:700}
/* 平板横屏（宽而矮）：词典固定在右上方，避免被长段落挤到屏幕下方 */
@media(min-width:821px) and (orientation:landscape){
  aside.right{
    position:fixed;
    top:14px;
    right:14px;
    width:320px;
    max-height:calc(100vh - 28px);
    z-index:40;
  }
  aside.right .dict-panel{
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 28px);
  }
  aside.right .dict-body{flex:1 1 auto;max-height:none;overflow:auto}
  /* 右侧不再占位，正文让出空间，避免被浮层压住 */
  main{padding-right:360px}
  header{padding-right:360px}
}
/* 触控优化：词条点击区域更友好 */
@media(pointer:coarse){
  .word{padding:1px 3px;border-radius:5px}
  button,.btn,a.linkbtn,button.linkbtn,.toolbar button{padding:10px 14px}
}
</style>
</head>
<body>

<header>
  <div class="logo">🈶</div>
  <div>
    <h1>英语翻译助手</h1>
    <p>中英双向互译 · 逐行对照 · 点击取词 · 本地离线可用</p>
  </div>
  <div class="header-right">
    <button class="btn" id="openDictBtn" title="输入英文或中文查词">🔍 查词</button>
    <button class="btn" id="updateBtn" title="检查更新">🔄 更新</button>
    <button class="btn" onclick="window.print()">🖨 打印</button>
  </div>
</header>

<div class="banner info" id="banner" hidden>
  <span class="ico" id="bannerIco">ℹ️</span>
  <div class="msg" id="bannerMsg"></div>
  <button class="x" onclick="hideBanner()" title="关闭">✕</button>
</div>

<main>
  <div class="left">
    <div class="card">
      <div class="toolbar">
        <label>导入文档</label>
        <input type="file" id="fileInput" accept=".txt,.md,.html,.pdf,.docx,.doc,application/pdf" title="支持中文或英文文档，自动识别方向">
        <button class="primary" onclick="loadBundled()">📄 载入内置文档</button>
        <div class="spacer"></div>
        <label><input type="checkbox" id="autoTr" style="vertical-align:middle"> 导入时联网自动翻译</label>
        <label>取词方式</label>
        <select id="modeSel" onchange="setMode(this.value)">
          <option value="click">点击取词</option>
          <option value="hover">悬停取词</option>
        </select>
      </div>
      <!-- 听力播放器：逐句朗读 + 高亮跟随 -->
      <div class="tts-bar" id="ttsBar">
        <button class="tts-btn primary" id="ttsPlay" title="从头播放">▶ 朗读全文</button>
        <button class="tts-btn" id="ttsPause" title="暂停 / 继续" disabled>⏸ 暂停</button>
        <button class="tts-btn" id="ttsPrev" title="上一句">⏮</button>
        <button class="tts-btn" id="ttsNext" title="下一句">⏭</button>
        <button class="tts-btn" id="ttsStop" title="停止" disabled>⏹</button>
        <label class="tts-opt"><input type="checkbox" id="ttsLoop"> 循环</label>
        <label class="tts-opt"><input type="checkbox" id="ttsZh" checked> 读译文</label>
        <label class="tts-opt tts-rate">
          语速<input type="range" id="ttsRate" min="0.5" max="1.5" step="0.1" value="1">
          <span id="ttsRateVal">1.0x</span>
        </label>
        <span class="tts-state" id="ttsState"></span>
      </div>
      <div class="body" id="content">
        <div class="loading">正在加载…</div>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <aside class="right">
    <div class="card dict-panel">
      <div class="sheet-handle" id="sheetHandle" title="上下拖动可调高度"><span></span></div>
      <h3>📖 词典 · 点击下方英文单词查看释义
        <button class="sheet-close" id="sheetClose" title="收起词典">✕</button>
      </h3>
      <div class="dict-search">
        <input type="search" id="dictSearch" enterkeyhint="search" autocomplete="off"
               placeholder="输入英文或中文，如 extinction / 灭绝">
        <button id="dictSearchBtn" title="查词">查</button>
      </div>
      <!-- 术语在线：联网跳转到全国科技术语权威平台 -->
      <div class="term-line">
        <button id="termOnlineBtn" title="跳转到术语在线，查询权威科技术语">🔬 术语在线（科学术语权威）</button>
        <span class="term-note">联网后，可直接在「术语在线」查标准译名（全国科技术语委）</span>
      </div>
      <div class="dict-body" id="dictBody">
        <div class="dict-empty">点击左侧任意英文单词，这里会显示它在牛津词典中的释义。</div>
      </div>
      <div class="status">词库内置本篇所有关键词；任意单词点击均会尽力解析。</div>
    </div>
  </aside>
</main>

<script>
/*__DATA__*/

const DATA = window.APP_DATA;
const dictBody = document.getElementById('dictBody');
const content = document.getElementById('content');
const status = document.getElementById('status');

// ---------- data lookup ----------
function normKey(w){ return w.toLowerCase(); }

function lookup(word){
  // try several normalized forms of the word
  const candidates = forms(word);
  for(const c of candidates){
    const k = normKey(c.w);
    let res = lookupOne(k, c.w);
    if(res && res.entry) return res;
  }
  return null;
}

// generate candidate (raw word, normalized key) forms
function forms(word){
  let w = word.trim();
  const out = [{w:w, note:''}];
  // possessive 's / s' 
  if(/'\w*$/.test(w)){
    out.push({w: w.replace(/'s$/,''), note:'〔所有格 -\'s〕'});
    out.push({w: w.replace(/'$/, ''), note:'〔-s\' 复数所有格〕'});
    out.push({w: w.replace(/s'$/,'s'), note:''});
  }
  // contractions: don't -> do not, can't -> can, won't -> will, it's -> it is
  const c1 = {
    "don't":"do not","can't":"can not","won't":"will not","shan't":"shall not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "hasn't":"has not","haven't":"have not","hadn't":"had not",
    "doesn't":"does not","didn't":"did not","it's":"it is","that's":"that is",
    "there's":"there is","i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would",
    "we're":"we are","we've":"we have","we'll":"we will","you're":"you are",
    "you've":"you have","you'll":"you will","they're":"they are","they've":"they have",
    "he's":"he is","she's":"she is","who's":"who is","what's":"what is",
    "let's":"let us","wouldn't":"would not","couldn't":"could not",
    "shouldn't":"should not","mustn't":"must not",
  };
  const lk = normKey(w);
  if(c1[lk]){ out.push({w: c1[lk], note:'〔缩写 '+w+' → '+c1[lk]+'〕'}); }
  return out;
}

function lookupOne(k, word){
  // direct
  if(DATA.dictionary[k]) {
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k]));
    e.headword = word + (normKey(word)!==k && /^[a-z]/i.test(word) && word.toLowerCase()!==k && !DATA.dictionary[normKey(word)] ? '（' + e.headword + '）' : '');
    return {entry:e, word};
  }
  // function word
  if(DATA.funcWords && DATA.funcWords[k]) {
    return {entry:{headword:word, ipa:'', pos:[],
      meanings:[{zh:DATA.funcWords[k], en:''}],
      example:'', notes:'常用功能词 / function word'}, word};
  }
  // inflection -> base
  if(DATA.inflect && DATA.inflect[k]) {
    const base = DATA.inflect[k];
    if(DATA.dictionary[base]){
      const e = JSON.parse(JSON.stringify(DATA.dictionary[base]));
      e.headword = word + '（' + e.headword + '）';
      return {entry:e, word};
    }
    if(DATA.funcWords[base]){
      return {entry:{headword:word+'（'+base+'）', ipa:'', pos:[],
        meanings:[{zh:DATA.funcWords[base], en:''}], example:'', notes:'常用词'}, word};
    }
  }
  // trivial depluralize
  if(k.endsWith('s') && DATA.dictionary[k.slice(0,-1)]){
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k.slice(0,-1)]));
    e.headword = word + '（' + e.headword + '）';
    return {entry:e, word};
  }
  return {entry:null, word};
}

// render dictionary entry
function renderDict(entry, word){
  if(!entry){
    const w = String(word || '').trim();
    const q = encodeURIComponent(w.toLowerCase());
    dictBody.innerHTML =
      '<div class="dict-card hit">' +
        '<div class="dword">' + esc(w) + '</div>' +
        '<div class="dmiss">本地词库暂未收录 <b>' + esc(w) + '</b>。<br>可点下面按钮在线查询：</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
          '<button class="linkbtn" id="wordOnlineBtn">🌐 联网查词（多义）</button>' +
          '<a class="linkbtn" target="_blank" rel="noopener" ' +
             'href="https://www.bing.com/dict/search?q=' + q + '">🔎 必应词典</a>' +

// ---------- 词典内查词：英→中 / 中→英（均支持一词多义） ----------
let _zhIndex = null;      // 中文释义 → 英文单词（首次查询时构建）

function stripZhNote(s){
  return String(s||'')
    .replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'')
    .replace(/\[[^\]]*\]/g,'');
}

// 把一条中文释义拆成多个可检索词条
function zhTerms(s){
  return stripZhNote(s)
    .split(/[；;，,、\/|]+/)
    .map(x=>x.replace(/^(的|地|得|使|把|被)/,'').trim())
    .filter(x=>x && x.length<=10);
}

function buildZhIndex(){
  if(_zhIndex) return _zhIndex;
  const idx = new Map();
  const push = (term, w)=>{
    let arr = idx.get(term);
    if(!arr){ arr = []; idx.set(term, arr); }
    if(arr.indexOf(w) < 0) arr.push(w);
  };
  const dict = DATA.dictionary || {};
  Object.keys(dict).forEach(w=>{
    (dict[w].meanings||[]).forEach(m=>{ zhTerms(m.zh).forEach(t=>push(t, w)); });
  });
  const fw = DATA.funcWords || {};
  Object.keys(fw).forEach(w=>{ zhTerms(fw[w]).forEach(t=>push(t, w)); });
  _zhIndex = idx;
  return idx;
}

// 中文查英文：先精确命中，再退化为包含匹配
function searchZh(q){
  const key = String(q||'').trim();
  if(!key) return [];
  if(key.length > 12) return [];        // 太长（整句）不做本地检索
  const idx = buildZhIndex();

  const exact = idx.get(key);
  if(exact && exact.length) return exact.slice(0, 30);

  // 宽松匹配：只允许「词条包含查询串」；
  // 短查询（<=4 字）才额外允许「查询串包含词条」，且词条至少 2 字，
  // 否则长句子里的"的""词"这类短词会把大量无关条目带进来。
  const allowReverse = key.length <= 4;
  const loose = [];
  for(const pair of idx){
    const term = pair[0];
    let hit = term.indexOf(key) >= 0;
    if(!hit && allowReverse && term.length >= 2) hit = key.indexOf(term) >= 0;
    if(hit){
      pair[1].forEach(w=>{ if(loose.indexOf(w) < 0) loose.push(w); });
      if(loose.length >= 40) break;
    }
  }
  return loose;
}

// ---------- 术语在线：权威科技术语（全国科技术语委） ----------
// 使用术语在线公开的 drawWordSearch 接口（匿名可用、CORS 开放）。
// 仅为「用户当前查的这一个词」实时查询，不做批量抓取。
//
// 相关性校验：接口按「包含」匹配，会把 the→THE(卫生总费用)、in→IN(智能网)
// 这类缩写误命中，必须过滤，否则常查词会弹出无关专业术语。
const TERM_STOPWORDS = (function(){
  const s = 'a an the and or but if so as of to in on at by for with from into about than then ' +
            'that this these those is am are was were be been being do does did done have has had ' +
            'having will would shall should can could may might must not no nor too very just only ' +
            'also such same other another each every all any some few many much more most less least ' +
            'he she it they we you i me him her them us my your his its our their who whom whose ' +
            'which what when where why how there here now then once again ever never always often ' +
            'sometimes usually up down out off over under further';
  const o = {};
  s.split(/\s+/).forEach(function(w){ if(w) o[w] = 1; });
  return o;
})();

// 术语查询内存缓存：正文取词会反复点同一个词，避免重复请求
const TERM_CACHE = {};

// 拆分 en 字段（可能是 "a,b" 或 "neuron(拉)" 形态）为候选英文名
function termEnVariants(en){
  const out = [];
  String(en || '').split(/[,;，；]/).forEach(function(part){
    const p = part.replace(/[（(].*?[）)]/g, '').trim();
    if(p) out.push(p);
  });
  return out;
}

// 判断接口返回是否真的与用户查询相关
function termIsRelevant(query, r){
  const q = String(query || '').trim();
  if(!q || !r) return false;
  const cn = String(r.cn || '').trim();

  // 中文查询：中文词条精确或用包含关系即可
  if(/[\u3400-\u9fff\uf900-\ufaff]/.test(q)){
    if(!cn) return false;
    return cn === q || cn.indexOf(q) >= 0;
  }

  const ql = q.toLowerCase();
  if(TERM_STOPWORDS[ql]) return false;      // 冠词/介词/助动词一律不弹术语卡

  const vs = termEnVariants(r.en);
  if(!vs.length) return false;

  // 短词（≤4 字母）：要求整体相等，避免缩写误配
  if(ql.length <= 4){
    for(let i=0;i<vs.length;i++){
      const v = vs[i], vl = v.toLowerCase();
      if(vl !== ql) continue;
      if(q === q.toUpperCase() && v === v.toUpperCase()) return true;   // 全大写↔缩写
      if(q !== q.toUpperCase() && v !== v.toUpperCase()) return true;    // 普通↔普通
      if(ql.length >= 3 && q !== q.toUpperCase() && v === v.toUpperCase()) return true; // dna↔DNA
    }
    return false;
  }

  // 长词：整体相等 / 去复数 s / 长度≥5 的包含匹配
  for(let i=0;i<vs.length;i++){
    const vl = vs[i].toLowerCase();
    if(vl === ql) return true;
    if(ql.slice(-1) === 's' && vl === ql.slice(0, -1)) return true;
    if(ql.length >= 5 && vl.indexOf(ql) >= 0) return true;
  }
  return false;
}

async function fetchTermOnline(term){
  const q = String(term || '').trim();
  if(!q) return null;
  if(TERM_STOPWORDS[q.toLowerCase()]) return null;   // 提前跳过，省一次请求

  // 内存缓存：同一词不重复请求（正文取词会频繁点同一个词）
  const ck = q.toLowerCase();
  if(TERM_CACHE.hasOwnProperty(ck)) return TERM_CACHE[ck];

  const url = 'https://www.termonline.cn/main-serve/business/tm/tmWord/drawWordSearch?term=' +
              encodeURIComponent(q);
  try{
    const j = await httpJson(url, {
      'Accept':'application/json, text/plain, */*'
    }, 9000);
    const r = (j && j.result) || null;
    let out = null;
    if(r && (r.cn || r.en) && termIsRelevant(q, r)) out = r;   // 过滤误命中
    // 只缓存「有结果」与「明确未收录」，避免网络抖动把失败也缓存住
    if(out) TERM_CACHE[ck] = out;
    else if(r) TERM_CACHE[ck] = null;
    return out;
  }catch(e){
    return null;
  }
}

let _searchSeq = 0;
async function dictSearch(raw){
  const q = String(raw || '').trim();
  if(!q) return;
  const seq = ++_searchSeq;
  const isCJK = /[\u3400-\u9fff\uf900-\ufaff]/.test(q);

  if(typeof window.openDictSheet === 'function') window.openDictSheet(null);

  // -------- 英文 / 拉丁字母输入 --------
  if(!isCJK){
    const res = lookup(q);
    // 并发查术语在线（专业术语的权威译名）；包一层确保始终是 Promise
    const termP = Promise.resolve(fetchTermOnline(q)).catch(function(){ return null; });

    if(res && res.entry){
      renderDict(res.entry, q);
      // 本地命中后再补一张权威术语卡（若命中）
      termP.then(function(t){
        if(seq !== _searchSeq || !t) return;
        const extra = termCardHtml(t);
        // 仅当术语译名与本地不同、或有定义时追加，避免重复噪声
        const card = document.createElement('div');
        card.innerHTML = extra;
        const node = card.firstElementChild;
        if(node) dictBody.appendChild(node);
        bindTermMore(t);
      });
      return;
    }

    dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
      '<div class="dmiss">本地词库未收录，正在联网查询…</div></div>';
    // 术语在线优先（比通用词典更权威）
    try{
      const t = await termP;
      if(seq === _searchSeq && t){
        dictBody.innerHTML = termCardHtml(t);
        bindTermMore(t);
        return;
      }
    }catch(e){}
    try{
      const d = await fetchYoudao(q);
      if(seq === _searchSeq && d && d.senses && d.senses.length){ renderOnlineSenses(q, d); return; }
    }catch(e){}
    try{
      const zh = await fetchTranslate(q, 'en2zh');
      if(seq === _searchSeq && zh){
        dictBody.innerHTML = '<div class="dict-card hit"><div class="dword">'+esc(q)+'</div>'+
          '<div class="dmean">'+esc(zh)+'</div>'+
          '<div class="dnotes">联网翻译结果（可能只给一个义项）</div></div>';
        return;
      }
    }catch(e){}
    if(seq === _searchSeq) renderDict(null, q);
    return;
  }

  // -------- 中文输入：先查本地反查索引 --------
  const words = searchZh(q);
  const termPZh = Promise.resolve(fetchTermOnline(q)).catch(function(){ return null; });

  if(words.length){
    renderSearchList(q, words);
    termPZh.then(function(t){
      if(seq !== _searchSeq || !t) return;
      const card = document.createElement('div');
      card.innerHTML = termCardHtml(t);
      const node = card.firstElementChild;
      if(node) dictBody.appendChild(node);
      bindTermMore(t);
    });
    return;
  }

  dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
    '<div class="dmiss">本地词库没有「'+esc(q)+'」，正在查询术语在线…</div></div>';
  // 术语在线优先（权威科技术语）
  try{
    const t = await termPZh;
    if(seq === _searchSeq && t){
      dictBody.innerHTML = termCardHtml(t);
      bindTermMore(t);
      return;
    }
  }catch(e){}

  dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
    '<div class="dmiss">术语在线未收录，正在联网翻译成英文…</div></div>';
  try{
    const en = await translateOne(q, true);
    if(seq === _searchSeq && en){
      const clean = en.replace(/[.。,，;；!！?？]+$/,'').trim();
      const first = clean.split(/\s+/).filter(Boolean)[0] || '';
      const res = first ? lookup(first) : null;
      let html = '<div class="dict-card hit"><div class="dword">'+esc(q)+'</div>'+
                 '<div class="dmean">→ '+esc(clean)+'</div>'+
                 '<div class="dnotes">联网翻译结果</div></div>';
      if(res && res.entry){
        html += '<div class="dict-card">'+
                '<div class="dword">'+esc(res.entry.headword)+' <span class="dipa">'+esc(res.entry.ipa||'')+'</span></div>';
        (res.entry.meanings||[]).forEach(m=>{
          html += '<div class="dmean">' + (m.pos?'<span class="dpos2">'+esc(m.pos)+'</span>':'') + esc(m.zh) + '</div>';
        });
        html += '</div>';
      }
      dictBody.innerHTML = html;
      return;
    }
  }catch(e){}
  if(seq === _searchSeq){
    dictBody.innerHTML = '<div class="dict-card hit"><div class="dword">'+esc(q)+'</div>'+
      '<div class="dmiss">没有查到「'+esc(q)+'」。' +
      (navigator.onLine === false ? '<br>当前处于离线状态，中文查英文需要联网。' : '') +
      '</div></div>';
  }
}

// ---------- 手机竖屏：跟随单词的浮动词典窗 ----------
(function(){
  const sheet    = document.querySelector('aside.right');
  const handle   = document.getElementById('sheetHandle');
  const closeBtn = document.getElementById('sheetClose');
  if(!sheet) return;

  const isMobile = () => window.matchMedia('(max-width:820px)').matches;

  const DEF_RATIO = 0.30;   // 默认占 30% 屏高
  const MIN_RATIO = 0.18;   // 低于这个高度视为收起
  const MAX_RATIO = 0.60;   // 拖动上限
  const GAP = 8;            // 与单词的间距
  const EDGE = 10;          // 与屏幕边缘的间距

  let customH = 0;          // 用户拖动后的高度（0=用默认 30%）
  let anchorEl = null;      // 当前取词的单词元素
  let rafId = 0;

  function sheetHeight(){
    return customH || Math.max(120, Math.round(window.innerHeight * DEF_RATIO));
  }

  // 把窗体摆到单词正下方；下方放不下就翻到上方；再不行夹在视口内
  function place(){
    if(!isMobile()) return;
    const h  = sheetHeight();
    const vh = window.innerHeight;
    let top;

    if(anchorEl && anchorEl.getBoundingClientRect){
      const r = anchorEl.getBoundingClientRect();
      top = r.bottom + GAP;
      if(top + h > vh - EDGE) top = r.top - h - GAP;   // 下方放不下 → 放上方
    } else {
      top = vh - h - EDGE;                             // 没锚点 → 贴底
    }
    top = Math.max(EDGE, Math.min(vh - h - EDGE, top));

    sheet.style.height = h + 'px';
    sheet.style.top    = top + 'px';
  }

  // 显式声明为局部函数，再挂到 window 供外部调用
  //（只写 window.X = fn 依赖隐式全局变量，作用域一变就会 ReferenceError）
  function openDictSheet(el){
    if(!isMobile()) return;
    anchorEl = el || null;
    sheet.classList.add('open');
    place();
    const body = document.getElementById('dictBody');
    if(body) body.scrollTop = 0;          // 每次取词都从释义开头看
  }

  function closeDictSheet(){
    sheet.classList.remove('open');
    anchorEl = null;
  }

  window.openDictSheet  = openDictSheet;
  window.closeDictSheet = closeDictSheet;

  if(closeBtn){
    closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeDictSheet(); });
  }

  // 页面滚动：窗体跟着单词走（rAF 节流，避免滚动抖动）
  function onScroll(){
    if(!sheet.classList.contains('open') || !isMobile()) return;
    if(rafId) return;
    rafId = window.requestAnimationFrame(function(){ rafId = 0; place(); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});

  // 退出浮动模式（如平板从竖屏转横屏）：必须清掉内联定位，
  // 否则残留的 top/height 会把右侧的固定侧栏顶到屏幕下方，遮住释义。
  function exitFloatMode(){
    closeDictSheet();
    customH = 0;
    sheet.style.removeProperty('top');
    sheet.style.removeProperty('height');
  }

  // 转屏/改宽度：回大屏就收起；仍在窄屏则重新定位
  window.addEventListener('resize', function(){
    if(!isMobile()){ exitFloatMode(); return; }
    if(sheet.classList.contains('open')) place();
  });
  // 横屏时初始加载就清一次，保证右侧栏贴顶
  if(!isMobile()) exitFloatMode();

  // 拖动顶部横条：上滑加高、下滑变矮，拖太矮则收起
  let dragging = false, startY = 0, startH = 0;
  const yOf = e => (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;

  function onDown(e){
    if(!isMobile() || !sheet.classList.contains('open')) return;
    dragging = true;
    startY = yOf(e);
    startH = sheet.getBoundingClientRect().height;
  }
  function onMove(e){
    if(!dragging) return;
    const dy = yOf(e) - startY;              // 向下拖为正 → 变矮
    let h = startH - dy;
    h = Math.max(70, Math.min(window.innerHeight * MAX_RATIO, h));
    customH = h;
    place();
    if(e.cancelable) e.preventDefault();
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    const h = sheet.getBoundingClientRect().height;
    if(h < window.innerHeight * MIN_RATIO){  // 拖得太矮 → 收起
      customH = 0;
      closeDictSheet();
    } else {
      customH = h;
      place();
    }
  }

  if(handle){
    handle.addEventListener('touchstart', onDown, {passive:true});
    handle.addEventListener('touchmove',  onMove, {passive:false});
    handle.addEventListener('touchend',   onUp);
    handle.addEventListener('mousedown',  onDown);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);

  // 点正文空白处收起（点单词本身不会触发：词的事件已 stopPropagation）
  const leftCol = document.querySelector('main .left');
  if(leftCol){
    leftCol.addEventListener('click', function(){
      if(sheet.classList.contains('open')) closeDictSheet();
    });
  }
})();

let currentWords = [];

// 判断一段文本的主语言方向
function detectDir(s){
  const t = String(s || '');
  const cjk = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
  const lat = (t.match(/[A-Za-z]/g) || []).length;
  if(cjk === 0) return 'en2zh';
  if(lat === 0) return 'zh2en';
  // 一个汉字承载的信息量约等于两个拉丁字母
  return (cjk * 2 >= lat) ? 'zh2en' : 'en2zh';
}

    } else {

              (seg.zh ? esc(seg.zh) : '（待翻译）')+'</div>';

function tokenize(text){
  // split into word / non-word tokens
  const parts = text.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g);
  let out = '';
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    if(!p) continue;
    if(/^[A-Za-z]/.test(p)){
      out += '<span class="word" data-w="'+esc(normKey(p))+'">'+esc(p)+'</span>';
    } else {
      out += esc(p);
    }
  }
  return out;
}

function fetchWithTimeout(url, opts, ms){
  return new Promise((resolve, reject)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); reject(new Error('请求超时（'+Math.round(ms/1000)+'秒）')); }, ms);
    fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
      .then(r=>{ clearTimeout(timer); resolve(r); })
      .catch(e=>{ clearTimeout(timer); reject(e); });
  });
}

// 逐批翻译，边翻边更新页面
async function translateEntries(entries){
  const BATCH = 6;
  let done = 0;
  for(let i=0;i<entries.length;i+=BATCH){
    const chunk = entries.slice(i, i+BATCH);
    try{
      const resp = await fetchWithTimeout(SERVER_BASE + '/api/translate-lines', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({lines: chunk.map(e=>e.en)})
      }, 40000);
      const data = await resp.json();
      if(data && data.ok && Array.isArray(data.zh)){
        data.zh.forEach((z,k)=>{
          if(z){
            entries[i+k].zh = z;
            updateZh(i+k, z);
            done++;
          }
        });
      }
    }catch(err){
      // 网络不可用就停止，保留英文
      break;
    }
  }
  return done;
}

// 数据全部内置，PDF/DOCX 在设备本地用 js 解析，联网查询直接访问在线接口。

// ================= 网络层：优先走 Capacitor 原生 HTTP（不受 CORS 限制） =================
function capBridge(){ return (window.Capacitor || null); }

// GET -> {status, text}；失败抛错
async function httpGet(url, headers, ms){
  const timeout = ms || 15000;
  const cap = capBridge();

  // 1) 直接用桥接的 nativePromise 调 CapacitorHttp（最稳，完全绕过 WebView 的 CORS）
  if(cap && typeof cap.nativePromise === 'function'){
    try{
      const res = await cap.nativePromise('CapacitorHttp', 'request', {
        url: url,
        method: 'GET',
        headers: headers || {},
        connectTimeout: 12000,
        readTimeout: timeout,
        responseType: 'text'
      });
      if(res && (res.status === 0 || res.status)){
        let data = res.data;
        if(data && typeof data === 'object') data = JSON.stringify(data);
        return {status: res.status || 0, text: String(data == null ? '' : data)};
      }
    }catch(e){ /* 落到下一层 */ }
  }

  // 2) 若已注册 CapacitorHttp 插件对象
  if(cap && cap.Plugins && cap.Plugins.CapacitorHttp){
    try{
      const res = await cap.Plugins.CapacitorHttp.get({
        url: url, headers: headers || {},
        connectTimeout: 12000, readTimeout: timeout
      });
      let data = res ? res.data : '';
      if(data && typeof data === 'object') data = JSON.stringify(data);
      return {status: (res && res.status) || 0, text: String(data == null ? '' : data)};
    }catch(e){ /* 落到下一层 */ }
  }

  // 3) 普通浏览器 / 已被 native-bridge 打补丁的 fetch
  const r = await fetchWithTimeout(url, {headers: headers || {}, cache: 'no-store'}, timeout);
  return {status: r.status, text: await r.text()};
}

async function httpJson(url, headers, ms){
  const r = await httpGet(url, headers, ms);
  if(r.status && r.status >= 400) throw new Error('HTTP '+r.status);
  try{ return JSON.parse(r.text); }
  catch(e){ throw new Error('返回内容不是 JSON'); }
}

// POST（表单）-> {status, text}；用于有道整句翻译接口
async function httpPost(url, body, headers, ms){
  const timeout = ms || 15000;
  const hdr = Object.assign({'Content-Type':'application/x-www-form-urlencoded'}, headers || {});
  const cap = capBridge();

  // 1) 原生通道（不受 CORS 限制）
  if(cap && typeof cap.nativePromise === 'function'){
    try{
      const res = await cap.nativePromise('CapacitorHttp', 'request', {
        url: url,
        method: 'POST',
        headers: hdr,
        data: body,
        connectTimeout: 12000,
        readTimeout: timeout,
        responseType: 'text'
      });
      if(res && (res.status === 0 || res.status)){
        let data = res.data;
        if(data && typeof data === 'object') data = JSON.stringify(data);
        return {status: res.status || 0, text: String(data == null ? '' : data)};
      }
    }catch(e){ /* 落到下一层 */ }
  }

  // 2) 普通 fetch
  const r = await fetchWithTimeout(url, {
    method:'POST', headers: hdr, body: body, cache:'no-store'
  }, timeout);
  return {status: r.status, text: await r.text()};
}

async function httpPostJson(url, body, headers, ms){
  const r = await httpPost(url, body, headers, ms);
  if(r.status && r.status >= 400) throw new Error('HTTP '+r.status);
  try{ return JSON.parse(r.text); }
  catch(e){ throw new Error('返回内容不是 JSON'); }
}

  'User-Agent':'Mozilla/5.0 (Linux; Android 12; HarmonyOS) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36',
  'Referer':'https://dict.youdao.com/',

// 把有道 jsonapi 的 ec.word 解析成多义词
function parseJsonapiSenses(j){
  const strip = s => String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\u200b/g,'').trim();
  const ec = j && j.ec;
  if(!ec || !Array.isArray(ec.word) || !ec.word.length) return null;
  const w0 = ec.word[0];
  const ipa = strip(w0.phonetic) || strip(w0.usphone) || strip(w0.ukphone);
  let senses = [], seen = {};
  const POS_RE = /^((?:[A-Za-z]{1,6}\.)+)\s*(.*)$/;
  const push = (pos, zh) => {
    zh = strip(zh);
    if(!zh) return;
    if(zh.includes('【') || zh.includes('人名')) return;   // 过滤"（人名）"等噪声
    const key = (pos||'') + '|' + zh;
    if(seen[key]) return;
    seen[key] = 1;
    senses.push({pos:strip(pos||''), zh:zh, en:'', ex:''});
  };
  (w0.trs||[]).forEach(tr=> (tr.tr||[]).forEach(it=>{
    let phrase = (it.l||{}).i || [];
    if(Array.isArray(phrase)) phrase = phrase.join(' ');
    const text = strip(phrase);
    const m = text.match(POS_RE);
    if(m) push(m[1], m[2]); else push('', text);
  }));
  if(!senses.length) return null;
  return {ipa:ipa, senses:senses.slice(0,10)};
}

// 解析 suggest 的指定词条（explain 形如 "n. 银行；岸"）
function parseSuggestEntry(entry){
  const strip = s => String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\u200b/g,'').trim();
  const text = strip(entry && entry.explain);
  if(!text) return null;
  let senses = [], seen = {};
  const POS_RE = /((?:[A-Za-z]{1,6}\.)+)\s*/g;
  // 按 "n. / v. / adj." 之类的词性标记切段
  const marks = [];
  let m;
  while((m = POS_RE.exec(text)) !== null){
    marks.push({pos:m[1], start:m.index, end:POS_RE.lastIndex});
  }
  if(!marks.length){
    return {ipa:'', senses:[{pos:'', zh:text, en:'', ex:''}]};
  }
  // 第一段（词性标记之前若有内容）
  if(marks[0].start > 0){
    const head = text.slice(0, marks[0].start).replace(/[;；,，]\s*$/,'').trim();
    if(head) senses.push({pos:'', zh:head, en:'', ex:''});
  }
  marks.forEach((mk, i)=>{
    const stop = (i+1 < marks.length) ? marks[i+1].start : text.length;
    let body = text.slice(mk.end, stop).replace(/[;；]\s*$/,'').trim();
    body = body.replace(/^(?:<[^>]+>)+/,'').trim();
    if(!body) return;
    const key = mk.pos + '|' + body;
    if(seen[key]) return;
    seen[key] = 1;
    senses.push({pos:mk.pos, zh:body, en:'', ex:''});
  });
  return senses.length ? {ipa:'', senses:senses.slice(0,10)} : null;
}

// 有道多义词：jsonapi 优先；suggest 只接受"完全同名"的词条，避免张冠李戴
async function fetchYoudao(word){
  const q = encodeURIComponent(word);
  const lw = String(word).trim().toLowerCase();

  // 1) jsonapi —— 释义最全
  try{
    const j = await httpJson('https://dict.youdao.com/jsonapi?q=' + q, YOUDAO_HEADERS, 12000);
    const r = parseJsonapiSenses(j);
    if(r) return r;
  }catch(e){}

  // 2) suggest —— 必须 entry === 查询词，否则会返回 campaign/chamber 之类的近似词
  try{
    const j = await httpJson('https://dict.youdao.com/suggest?num=10&doctype=json&q=' + q, YOUDAO_HEADERS, 12000);
    const ent = (j && j.data && j.data.entries) || [];
    for(const e of ent){
      if(e && String(e.entry || '').trim().toLowerCase() === lw){
        const r = parseSuggestEntry(e);
        if(r) return r;
      }
    }
  }catch(e){}

  return null;
}

// 英文释义兜底（dictionaryapi.dev）
async function fetchEnglishDefs(word){
  try{
    const j = await httpJson('https://api.dictionaryapi.dev/api/v2/entries/en/' +
      encodeURIComponent(word), {'Accept':'application/json'}, 10000);
    if(!Array.isArray(j)) return null;
    const out = [];
    j.slice(0,2).forEach(entry=>{
      (entry.meanings||[]).slice(0,3).forEach(m=>{
        const def = (m.definitions||[])[0];
        if(def && def.definition){
          out.push({pos:m.partOfSpeech||'', zh:'', en:def.definition,
                    ex:(def.example||'')});
        }
      });
    });
    return out.length ? out : null;
  }catch(e){ return null; }
}

// --- 覆盖：联网查词（有道多义 -> 翻译 -> 英文释义） ---

  if(!out) return;
  out.style.display = 'block';
  out.textContent = '正在联网查询「' + word + '」的各词义…';

      d.senses.forEach(s=>{
        let row = '<div class="dmean">';
        if(s.pos) row += '<span class="dpos2">'+esc(s.pos)+'</span> ';
        row += esc(s.zh);
        row += '</div>';
        h += row;
      });
      out.innerHTML = h;
      return;
    }
  }catch(e){ lastErr = e; }

  // 2) 整词翻译

      out.innerHTML = '<div class="dword">'+esc(word)+'</div>' +
        '<div class="dmean">'+esc(zh)+'</div>' +
        '<div class="dmiss">（联网翻译结果，可能只给出一个义项）</div>';

  const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
  out.innerHTML =
    '<div class="dmiss"><b>' + (offline ? '当前离线' : '未查到该词的中文释义') + '</b>' +
    (lastErr && lastErr.message ? '（' + esc(lastErr.message) + '）' : '') + '<br>' +
    (offline
      ? '请连接 Wi-Fi / 移动数据后重试。'
      : '「' + esc(word) + '」可能是缩写、专有名词或新词，词典未必收录。<br>' +
        '可点上方的「必应词典 / 必应搜索」在浏览器中查看。') +

// --- 整句/整词翻译：MyMemory（带重试）-> Google gtx 兜底 ---
// --- 段落翻译（双向）：MyMemory（带重试）-> Google gtx 兜底 ---
async function fetchTranslate(text, dir){
  const isZ2E = (dir === 'zh2en');
  const src = String(text || '').trim();
  if(!src) return '';

  // 长句按 URL 编码后的长度切分（MyMemory 对 q 有长度限制，中文尤其容易超）
  const parts = chunkByEncodedLen(src, 450);
  if(parts.length > 1){
    const outs = [];
    for(const p of parts){
      const r = await translateOne(p, isZ2E);
      if(!r) return '';
      outs.push(r);
      await new Promise(r2=>setTimeout(r2, 120));
    }
    // 中文译文不加空格，英文译文用空格连接
    return isZ2E ? outs.join(' ') : outs.join('');
  }
  return translateOne(src, isZ2E);
}

// 按 URL 编码后的长度切分文本，尽量在句末切开
function chunkByEncodedLen(text, budget){
  const enc = s => encodeURIComponent(s).length;
  if(enc(text) <= budget) return [text];
  const parts = text.split(/(?<=[。！？；.!?;])\s*/).filter(Boolean);
  const out = [];
  let buf = '';
  for(const p of parts){
    if(buf && enc(buf + p) > budget){ out.push(buf); buf = p; }
    else buf += p;
  }
  if(buf) out.push(buf);
  // 仍然超长的再硬切
  const final = [];
  for(const s of out){
    if(enc(s) <= budget){ final.push(s); continue; }
    let acc = '';
    for(const ch of s){
      if(acc && enc(acc + ch) > budget){ final.push(acc); acc = ch; }
      else acc += ch;
    }
    if(acc) final.push(acc);
  }
  return final;
}

// 最近一次翻译失败的原因（用于给用户看提示）
let lastTranslateError = '';

// --- 有道整句翻译（国内直连、无需密钥，作为首选）---
// POST https://aidemo.youdao.com/trans  q/from/to -> {errorCode:0, translation:[...]}
// 有道演示接口的限流：连续约 6 次后返回 errorCode 411，约 1 分钟后恢复
let youdaoBlockedUntil = 0;
// Google 在国内基本不通，失败一次后就别再让它拖 12 秒
let googleBlocked = false;

// 调用有道；joinedText 可以是多行（服务端按 \n 逐行返回，实测对齐良好）
async function youdaoCall(joinedText, isZ2E){
  if(Date.now() < youdaoBlockedUntil) throw new Error('有道限流冷却中');
  const body = 'q=' + encodeURIComponent(joinedText)
             + '&from=' + (isZ2E ? 'zh-CHS' : 'en')
             + '&to='   + (isZ2E ? 'en' : 'zh-CHS');
  const j = await httpPostJson('https://aidemo.youdao.com/trans', body,
      {'User-Agent': YOUDAO_HEADERS['User-Agent'], 'Referer': 'https://fanyi.youdao.com/'}, 20000);
  if(!j) throw new Error('空响应');
  // 注意：接口返回的 errorCode 是字符串 "0"，必须用 Number() 比较
  const code = j.errorCode;
  if(code !== undefined && code !== null && Number(code) !== 0){
    if(Number(code) === 411) youdaoBlockedUntil = Date.now() + 60000;
    throw new Error('errorCode ' + code);
  }
  const arr = j.translation;
  return Array.isArray(arr) ? arr.join('') : String(arr || '');
}

// 单句（用于逐条兜底）
async function translateByYoudao(text, isZ2E){
  return (await youdaoCall(text, isZ2E)).trim();
}

// 多句合并成一次请求：返回按行对齐的译文数组
async function translateBatchByYoudao(texts, isZ2E){
  const out = await youdaoCall(texts.join('\n'), isZ2E);
  return out.split(/\r?\n/);
}

// --- MyMemory（免费；按 IP 有每日额度，超了返回 429）---
async function translateByMyMemory(text, isZ2E){
  const clean = s => String(s||'')
      .replace(/\s*[\[【「].*$/,'')
      .replace(/MYMEMORY[\s\S]*$/,'')
      .replace(/\s+/g,' ').trim();
  const pair = isZ2E ? 'zh-CN|en' : 'en|zh-CN';
  const q = encodeURIComponent(text);
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const j = await httpJson('https://api.mymemory.translated.net/get?q=' + q + '&langpair=' + pair,
        {'Accept':'application/json'}, 12000);
      return clean((j.responseData||{}).translatedText);
    }catch(e){
      lastErr = e;
      if(attempt === 0){ await new Promise(r=>setTimeout(r, 600)); }
    }
  }
  throw lastErr || new Error('无结果');
}

// --- Google gtx（海外可用，国内通常被墙；失败一次就不再重试）---
async function translateByGoogle(text, isZ2E){
  if(googleBlocked) throw new Error('Google 已被墙（本次已放弃）');
  const sl = isZ2E ? 'zh-CN' : 'en';
  const tl = isZ2E ? 'en' : 'zh-CN';
  let j;
  try{
    j = await httpJson('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q=' + encodeURIComponent(text),
      {}, 5000);
  }catch(e){
    googleBlocked = true;
    throw e;
  }
  const out = (Array.isArray(j) && Array.isArray(j[0])) ? j[0].map(x=>(x&&x[0])||'').join('') : '';
  return String(out || '').replace(/\s+/g,' ').trim();
}

// 译文有效性：英→中要求含汉字；中→英要求含英文单词且基本不含汉字
function validTrans(s, isZ2E){
  if(!s) return false;
  return isZ2E
      ? (/[A-Za-z]{2,}/.test(s) && !/[\u4e00-\u9fff]/.test(s))
      : /[\u4e00-\u9fff]/.test(s);
}

// 依次尝试多个通道，返回第一个通过校验的译文
async function translateOne(text, isZ2E){
  const chain = [
    ['有道',     () => translateByYoudao(text, isZ2E)],
    ['MyMemory', () => translateByMyMemory(text, isZ2E)],
    ['Google',   () => translateByGoogle(text, isZ2E)],
  ];
  const errors = [];
  for(const item of chain){
    try{
      const t = await item[1]();
      if(t && validTrans(t, isZ2E)) return t;
      errors.push(item[0] + ': 结果无效');
    }catch(e){
      errors.push(item[0] + ': ' + String((e && e.message) || e).slice(0, 40));
    }
  }
  lastTranslateError = errors.join('；');
  return '';
}

// 把失败原因翻译成人话，便于用户判断该等一等还是查网络
function translateFailHint(){
  const e = lastTranslateError || '';
  if(/411/.test(e)) return '翻译接口调用过于频繁，已自动放慢，稍后再试即可。';
  if(/429|Too Many/i.test(e)) return '翻译接口今日免费额度已用完，请明天再试（或换个网络）。';
  if(/timeout|timed out|超时|abort/i.test(e)) return '翻译接口超时，请检查网络后重试。';
  if(/errorCode|空响应|HTTP 4|HTTP 5/i.test(e)) return '翻译接口暂时不可用，请稍后重试。';
  return '联网翻译失败' + (e ? '（' + e + '）' : '') + '，仅显示原文。';
}

// --- 逐批翻译（支持双向） ---
function srcOf(e){ return (e.dir === 'zh2en') ? (e.zh || '') : (e.en || ''); }
function setTrans(e, t){ if(e.dir === 'zh2en') e.en = t; else e.zh = t; }
function hasTrans(e){ return e.dir === 'zh2en' ? !!e.en : !!e.zh; }

// 把条目按「方向 + 字数 + 句数」分组，同组一次请求翻完（有道支持 \n 逐行返回）
// 注意：有道对单次 q 的长度上限约 1000 字符（超过返回 errorCode 103），
// 所以这里按「原始字符数」累计，控制在 800 以内留余量。
function buildBatches(entries, maxChars, maxLines){
  const batches = [];
  let cur = null;
  entries.forEach((e, i)=>{
    const dir = e.dir || 'en2zh';
    const len = String(srcOf(e) || '').length;
    if(!cur || cur.dir !== dir || cur.idxs.length >= maxLines || cur.len + len + 1 > maxChars){
      cur = {dir: dir, idxs: [], len: 0};
      batches.push(cur);
    }
    cur.idxs.push(i);
    cur.len += len + 1;
  });
  return batches;
}

// 有道被限流时，等到冷却结束再继续（接口约每分钟 6 次）
async function waitYoudaoCooldown(){
  const wait = youdaoBlockedUntil - Date.now();
  if(wait <= 0) return;
  const secs = Math.ceil(wait / 1000);
  showBanner('info', '翻译接口繁忙，正在等待 <b>' + secs + '</b> 秒后自动继续…');
  await new Promise(r=>setTimeout(r, wait + 500));
}

function translateEntries(entries){
  const MAX_CHARS = 800;    // 单次请求原文总长（原始字符，服务端上限约 1000）
  const MAX_LINES = 12;     // 单次请求最多合并几句
  const SINGLE_MAX = 800;   // 单句超过这个长度就直接走分片兜底
  const stats = {done: 0};

  const progress = ()=>{
    showBanner('info', '正在翻译… 已完成 <b>' + stats.done + ' / ' + entries.length + '</b> 句');
  };

  // 逐条兜底：走 fetchTranslate（内部会按长度分片，并依次尝试各通道）
  const perItem = async (idxs)=>{
    for(const i of idxs){
      const t = await fetchTranslate(srcOf(entries[i]), entries[i].dir || 'en2zh');
      if(t){ setTrans(entries[i], t); updateTr(i, t); stats.done++; progress(); }
    }
  };

  // 处理一批：失败自动拆分 / 等限流 / 兜底
  const runBatch = async (idxs, dir)=>{
    const isZ2E = (dir === 'zh2en');
    const texts = idxs.map(i => srcOf(entries[i]));
    const totalLen = texts.join('\n').length;

    // 单句就超长 → 不浪费请求，直接分片翻译
    if(idxs.length === 1 && totalLen > SINGLE_MAX){
      await perItem(idxs);
      return;
    }

    await waitYoudaoCooldown();

    for(let attempt = 0; attempt < 2; attempt++){
      try{
        const lines = await translateBatchByYoudao(texts, isZ2E);
        if(lines && lines.length === texts.length){
          lines.forEach((t, k)=>{
            const s = String(t || '').trim();
            if(validTrans(s, isZ2E)){
              setTrans(entries[idxs[k]], s);
              updateTr(idxs[k], s);
              stats.done++;
            }
          });
          progress();
          return;
        }
        // 行数对不上 → 对半拆开重试
        if(idxs.length > 1){ await splitAndRun(idxs, dir); return; }
        break;
      }catch(err){
        const msg = String((err && err.message) || '');
        if(/411/.test(msg)){                 // 频率限制：等冷却后重试
          await waitYoudaoCooldown();
          continue;
        }
        if(/103/.test(msg) && idxs.length > 1){ // 文本过长：对半拆开
          await splitAndRun(idxs, dir);
          return;
        }
        break;
      }
    }

    // 仍然不行 → 逐条兜底
    await perItem(idxs);
  };

  const splitAndRun = async (idxs, dir)=>{
    const mid = Math.ceil(idxs.length / 2);
    await runBatch(idxs.slice(0, mid), dir);
    await runBatch(idxs.slice(mid), dir);
  };

  return (async function run(){
    const batches = buildBatches(entries, MAX_CHARS, MAX_LINES);
    for(const b of batches){
      await runBatch(b.idxs, b.dir);
    }

    // 第二轮：把仍空着的再补一次，避免偶发失败留下「（待翻译）」
    const missed = [];
    entries.forEach((e, i)=>{ if(!hasTrans(e)) missed.push(i); });
    if(missed.length){
      await new Promise(r=>setTimeout(r, 800));
      await perItem(missed);
    }

    return stats.done;
  })();
}

// --- 本地解析 PDF（pdf.js） ---
async function extractPdfText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error('pdf.js 未加载');
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const parts = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const lineText = {};
    tc.items.forEach(it=>{
      const str = (it.str||'').replace(/\u00ad/g,'');
      if(!str.trim()) return;
      const y = Math.round(it.transform[5]);
      lineText[y] = (lineText[y]||'') + ' ' + str;
    });
    const pageLines = Object.keys(lineText).sort((a,b)=>b-a).map(k=>lineText[k].trim());
    parts.push(pageLines.join('\n'));
  }
  return parts.join('\n');
}

// --- 本地解析 DOCX（JSZip） ---
async function extractDocxText(arrayBuffer){
  if(!window.JSZip) throw new Error('JSZip 未加载');
  const zip = await JSZip.loadAsync(arrayBuffer);
  const file = zip.file('word/document.xml');
  if(!file) throw new Error('非法 DOCX：缺少 document.xml');
  const xml = await file.async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const paras = [];
  doc.querySelectorAll('w\\:p').forEach(p=>{
    const text = Array.from(p.querySelectorAll('w\\:t')).map(t=>t.textContent).join('').trim();
    if(text) paras.push(text);
  });
  return paras.join('\n');
}

// --- 断句（复用 server 思路，JS 版） ---
const _END_RE = /[.?!。！？]["'”’)]?\s*$/;
const _CUE = new Set(('of the a an to and or but in on at for with that which who whom whose from as by '+
  'is are was were has have had will would can could may might must not very more most this these those their '+
  'its our your his her my no nor so than then while when where').split(' '));
function _shouldJoin(buf, nxt){
  if(_END_RE.test(buf)) return false;
  const ws = buf.match(/[A-Za-z']+/) || [];
  const lastw = (ws[ws.length-1]||'').toLowerCase();
  if(_CUE.has(lastw)) return true;
  const tail = buf.trim().slice(-1);
  if(',;:-–—'.includes(tail)) return true;
  if(!nxt) return false;
  const c = nxt[0];
  if(!/[A-Za-z]/.test(c)) return true;
  if(c===c.toLowerCase() && c!==c.toUpperCase()) return true;
  return false;
}
function splitSentences(text){
  const lines = text.split(/\r?\n/)
    .map(s=>s.trim())
    .filter(s=>s && !/^change\s+times/i.test(s) && !/^\d+$/.test(s)
      && !/粉丝团/.test(s) && !/^\d[\d\s.\-–—|]+$/.test(s) && s.length>1);
  const joined = [];
  let buf='';
  lines.forEach(ln=>{
    if(buf){ if(_shouldJoin(buf,ln)) buf += ' '+ln; else { joined.push(buf); buf=ln; } }
    else buf = ln;
  });
  if(buf) joined.push(buf);
  const out = [];
  joined.forEach(ch=>{
    ch.split(/(?<=[.?!。！？])\s+(?=[A-Z0-9"'“‘(])/).forEach(p=>{
      p=p.trim();
      if(p && /[A-Za-z]{2,}/.test(p) && p.length>=2) out.push(p);
    });
  });
  return out;
}

// 页眉页脚 / 页码等噪声行
function isNoiseLine(ln){
  const t = String(ln || '').trim();
  if(!t) return true;
  if(/^change\s+times/i.test(t) || /粉丝团/.test(t)) return true;                    // 站点水印
  if(/^[\d\s.\-–—|/]+$/.test(t)) return true;                                        // 纯数字、破折号页码
  if(/^第\s*[0-9０-９一二三四五六七八九十百千]+\s*页\s*$/.test(t)) return true;          // 第 3 页
  if(/^page\s*\d+(\s*(of|\/)\s*\d+)?$/i.test(t)) return true;                        // Page 3 of 10
  if(/^\d+\s*\/\s*\d+$/.test(t)) return true;                                        // 3/10
  return false;
}

// --- 纯文本按行切分（中文行按句子再切一刀；英文行保持原样） ---
function entriesFromLines(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(ln=>{
    ln = ln.trim();
    if(isNoiseLine(ln)) return;
    const d = detectDir(ln);
    if(d === 'zh2en'){
      ln.split(/(?<=[。！？；])/).forEach(p=>{
        p = p.trim();
        if(p && /[\u4e00-\u9fff]/.test(p)) out.push({en:'', zh:p, dir:'zh2en'});
      });
    } else if(/[A-Za-z]{2,}/.test(ln)){
      out.push({en:ln, zh:'', dir:'en2zh'});
    }
  });
  return out;
}

// --- 把整篇文本按语言切成块（空行分隔），分别交给对应切分器 ---
function classifyBlocks(text){
  const blocks = [];
  let cur = null;
  String(text || '').split(/\r?\n/).forEach(ln=>{
    const t = ln.trim();
    if(!t){ cur = null; return; }
    if(isNoiseLine(t)) return;          // 页脚不应打断段落合并
    const d = detectDir(t);
    if(!cur || cur.dir !== d){ cur = {dir:d, text:''}; blocks.push(cur); }
    cur.text += (cur.text ? '\n' : '') + t;
  });
  return blocks;
}

// --- 文档（PDF/DOCX）→ 条目：英文沿用换行合并逻辑，中文按句切分 ---
function entriesFromDoc(text){
  const out = [];
  classifyBlocks(text).forEach(b=>{
    if(b.dir === 'zh2en'){
      out.push.apply(out, entriesFromLines(b.text));
    } else {
      splitSentences(b.text).forEach(s=>out.push({en:s, zh:'', dir:'en2zh'}));
    }
  });
  return out;
}

// --- 本地解析+导入任意文档 ---
// ===================== 听力朗读（方案A：系统 TTS） =====================
// 边看边听：逐句朗读，当前句高亮并自动滚入视野。
// 用浏览器内置 speechSynthesis，离线可用、零成本。
(function(){
  const bar     = document.getElementById('ttsBar');
  if(!bar) return;
  const playBtn  = document.getElementById('ttsPlay');
  const pauseBtn = document.getElementById('ttsPause');
  const prevBtn  = document.getElementById('ttsPrev');
  const nextBtn  = document.getElementById('ttsNext');
  const stopBtn  = document.getElementById('ttsStop');
  const loopChk  = document.getElementById('ttsLoop');
  const zhChk    = document.getElementById('ttsZh');
  const rateRng  = document.getElementById('ttsRate');
  const rateVal  = document.getElementById('ttsRateVal');
  const stateEl  = document.getElementById('ttsState');

  const synth = window.speechSynthesis || null;
  if(!synth){
    // 系统无语音引擎 → 不报错，直接改用在线语音
    // （鸿蒙/部分 Android WebView 没有 speechSynthesis）
  }

  function updateEngineHint(){
    if(!stateEl) return;
    if(engine === 'online'){
      stateEl.textContent = '在线语音（需联网）';
      stateEl.style.color = '#b45309';
    } else if(engine === 'system'){
      stateEl.style.color = '#15803d';
    }
  }

  let idx = 0;              // 当前读到第几句
  let playing = false;      // 正在播放整篇
  let paused = false;
  let token = 0;            // 每次操作递增，用于作废旧的回调
  let watchdog = 0;         // onend 不触发时的兜底定时器
  let voicesLoaded = false;
  let singleMode = false;   // 当前是否处于「只读一句」模式

  const RATE = () => (rateRng ? Number(rateRng.value) : 1) || 1;
  const wantZh = () => !!(zhChk && zhChk.checked);

  function setState(t){ if(stateEl) stateEl.textContent = t || ''; }

  function syncButtons(){
    if(playBtn)  playBtn.disabled  = playing && !paused;
    if(pauseBtn) pauseBtn.disabled = !playing;
    if(stopBtn)  stopBtn.disabled  = !playing;
    if(prevBtn)  prevBtn.disabled  = !currentEntries.length;
    if(nextBtn)  nextBtn.disabled  = !currentEntries.length;
    if(pauseBtn) pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  }

  // 选出某句要读的文本：英文原文 + （可选）中文译文
  function textOf(i){
    const e = currentEntries[i];
    if(!e) return null;
    const en = (e.dir === 'zh2en') ? (e.en || '') : (e.en || '');
    const zh = (e.dir === 'zh2en') ? (e.zh || '') : (e.zh || '');
    // 英文优先；中文只有勾选且已翻译才读
    return { en: en.trim(), zh: zh.trim() };
  }

  function isEnglishText(t){ return /[A-Za-z]/.test(t) && !/[\u4e00-\u9fff]/.test(t); }

  function pickVoice(lang){
    const vs = (synth && synth.getVoices) ? (synth.getVoices() || []) : [];
    if(!vs.length) return null;
    const want = lang.slice(0,2).toLowerCase();
    // 优先精确匹配语言，再退到前缀匹配
    let best = null;
    for(const v of vs){
      if(v.lang && v.lang.toLowerCase() === lang.toLowerCase()){ best = v; break; }
    }
    if(!best){
      for(const v of vs){
        if(v.lang && v.lang.toLowerCase().indexOf(want) === 0){ best = v; break; }
      }
    }
    // 英文优先挑本地/自然度高的（名称含 Google/Natural 的通常更好）
    if(best && want === 'en'){
      const better = vs.find(v => v.lang.toLowerCase().indexOf('en')===0 &&
        /google|natural|samantha|daniel/i.test(v.name||''));
      if(better) best = better;
    }
    return best;
  }

  function clearHighlight(){
    const all = content.querySelectorAll('.entry.tts-active');
    for(let i=0;i<all.length;i++) all[i].classList.remove('tts-active');
  }

  function highlight(i){
    clearHighlight();
    const el = content.querySelector('.entry[data-i="'+i+'"]');
    if(!el) return;
    el.classList.add('tts-active');
    // 滚入视野（尽量居中，别被顶部工具条挡住）
    try{
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      if(r.top < 90 || r.bottom > vh - 40){
        el.scrollIntoView({block:'center', behavior:'smooth'});
      }
    }catch(e){ try{ el.scrollIntoView(); }catch(e2){} }
  }

  function cancelWatchdog(){ if(watchdog){ clearTimeout(watchdog); watchdog = 0; } }

  // ============ 双引擎朗读 ============
  // 引擎1：系统 speechSynthesis（离线、免费，但部分 Android WebView 缺失）
  // 引擎2：在线语音（百度/道词典 mp3），系统引擎不可用时自动接管
  let engine = 'none';          // 'system' | 'online'
  let curAudio = null;          // 在线引擎当前的 Audio 对象
  let audioCache = {};          // url -> objectURL，避免重复请求
  let probePromise = null;      // 系统引擎可用性探测

  const hasSys = function(){
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  };

  // 探测系统引擎是否真的能发声（有对象不等于有语音包）
  // 说明：不追求「精确判断」，只要能在 1.5 秒内看到 onstart 就算可用；
  // 否则降级到在线语音。真正播放时若仍失败，speakOne 里还会再降级一次。
  function probeSystem(){
    if(probePromise) return probePromise;
    probePromise = new Promise(function(resolve){
      if(!hasSys()){ resolve(false); return; }
      let done = false;
      const finish = function(ok){
        if(done) return; done = true;
        try{ window.speechSynthesis.cancel(); }catch(e){}
        resolve(ok);
      };
      // 语音列表为空 → 大概率没有可用语音包
      let waitList = 0;
      (function checkVoices(){
        let vs = [];
        try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){}
        if(vs.length){ runProbe(); return; }
        if(waitList++ >= 10){ finish(false); return; }   // 等约 2 秒
        setTimeout(checkVoices, 200);
      })();

      function runProbe(){
        let started = false;
        try{
          const u = new window.SpeechSynthesisUtterance('a');
          u.volume = 0; u.rate = 2;
          u.onstart = function(){ started = true; finish(true); };
          u.onerror = function(){ if(!started) finish(false); };
          window.speechSynthesis.speak(u);
          // 2 秒内没 onstart → 认为不可用
          setTimeout(function(){ if(!started) finish(false); }, 2000);
        }catch(e){ finish(false); }
      }
    });
    return probePromise;
  }

  // 构造在线语音 URL（百度 fanyi，质量较好，支持中英文长句）
  function onlineUrl(text, lang){
    const isZh = !isEnglishText(text);
    const lan = isZh ? 'zh' : 'en';
    return 'https://fanyi.baidu.com/gettts?lan=' + lan +
           '&text=' + encodeURIComponent(text) + '&spd=3&source=web';
  }

  // 预取音频：用 CapacitorHttp 绕开 CORS 拿到二进制，转成 objectURL
  async function fetchAudioBlob(url){
    if(audioCache[url]) return audioCache[url];
    // 优先 CapacitorHttp（原生请求，不受 CORS 限制，可拿 base64/arraybuffer）
    const cap = capBridge();
    if(cap && typeof cap.nativePromise === 'function'){
      try{
        const res = await cap.nativePromise('CapacitorHttp', 'request', {
          url: url, method: 'GET',
          headers: { 'Accept':'audio/mpeg', 'Referer':'https://fanyi.baidu.com/' },
          responseType: 'arraybuffer',
          connectTimeout: 12000, readTimeout: 20000
        });
        const data = res && res.data;
        if(data && typeof data === 'string' && data.length > 200){
          // 返回的是 base64
          const bin = atob(data);
          const arr = new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
          const b = new Blob([arr], {type:'audio/mpeg'});
          const u = URL.createObjectURL(b);
          audioCache[url] = u;
          return u;
        }
      }catch(e){ /* 落到 fetch */ }
    }
    // 退回 fetch（桌面浏览器同源/CORS 允许时可用）
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const b = await r.blob();
    if(!b.size) throw new Error('音频为空');
    const u = URL.createObjectURL(b);
    audioCache[url] = u;
    return u;
  }

  // 用在线引擎读一段；读完/失败都调用 done
  function speakOneOnline(text, lang, done){
    const myToken = token;
    let finished = false;
    const finish = function(){
      if(finished) return; finished = true;
      if(myToken !== token) return;
      done();
    };
    const url = onlineUrl(text);
    fetchAudioBlob(url).then(function(objUrl){
      if(myToken !== token){ return; }
      const a = new Audio(objUrl);
      curAudio = a;
      a.playbackRate = Math.max(0.5, Math.min(2, RATE()));
      a.onended = finish;
      a.onerror = finish;
      const p = a.play();
      if(p && p.catch){ p.catch(function(){ finish(); }); }
      // 音频加载/播放异常时兜底
      cancelWatchdog();
      const est = Math.max(1500, text.length * 90 / RATE());
      watchdog = setTimeout(finish, est + 2500);
    }).catch(function(){
      finish();
    });
  }

  // 朗读一句；读完调用 done()
  function speakOne(text, lang, done){
    const myToken = token;

    if(engine === 'online'){ speakOneOnline(text, lang, done); return; }

    // 系统引擎
    const u = new window.SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = Math.max(0.5, Math.min(2, RATE()));
    const v = pickVoice(lang);
    if(v) u.voice = v;

    let finished = false;
    let started = false;
    const finish = function(ok){
      if(finished) return;
      finished = true;
      cancelWatchdog();
      if(myToken !== token) return;   // 已被新的操作取代
      if(!ok && !started){
        // 系统引擎这次没起来 → 永久切到在线引擎并重读这句
        engine = 'online';
        updateEngineHint();
        speakOneOnline(text, lang, done);
        return;
      }
      done();
    };

    u.onstart = function(){ started = true; };
    u.onend = function(){ finish(true); };
    u.onerror = function(){ finish(false); };   // 出错尝试降级

    // 安卓 WebView 上 onend 经常不触发 → 按估算时长兜底
    // 英文约 2.6 词/秒、中文约 4 字/秒，再乘语速
    const words = text.split(/\s+/).filter(Boolean).length;
    const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    const est = Math.max(1.2, (words/2.6 + cjk/4) / RATE()) * 1000;
    cancelWatchdog();
    watchdog = setTimeout(function(){ finish(true); }, est + 1800);

    try{ window.speechSynthesis.speak(u); }catch(e){ finish(false); }
  }

  // 读第 i 句：先英文，再（可选）中文；读完继续下一句
  // bump=false 表示「接着播」：沿用当前 token，不要把上一句的回调作废
  // singleOnly=true 表示「只读这一句，读完就停」（点句朗读用）
  function playFrom(i, bump, singleOnly){
    if(!currentEntries.length){ setState('请先导入文章'); return; }
    if(i < 0 || i >= currentEntries.length){
      // 到尾了
      if(loopChk && loopChk.checked){ i = 0; }
      else { stopPlay('✅ 朗读完毕'); return; }
    }
    const single = !!singleOnly;
    singleMode = single;
    idx = i;
    playing = true; paused = false;
    if(bump !== false){ token++; }
    const myToken = token;
    syncButtons();

    // 首次播放：先探测系统引擎是否真的能用，不能用就切在线语音
    if(engine === 'none'){
      setState('正在准备语音…');
      probeSystem().then(function(ok){
        if(myToken !== token) return;
        engine = ok ? 'system' : 'online';
        updateEngineHint();
        startSeqs();
      });
      return;
    }
    highlight(i);
    startSeqs();

    function startSeqs(){
      const parts = textOf(i);
      if(!parts){ stopPlay(''); return; }
      highlight(i);
      if(stateEl && engine === 'online'){
        setState('在线语音 · ' + (single ? '第 '+(i+1)+' 句' : (i+1)+'/'+currentEntries.length));
      }

      // 组装本句要读的片段
      const seqs = [];
      if(parts.en) seqs.push({ text: parts.en, lang: isEnglishText(parts.en) ? 'en-US' : 'zh-CN' });
      if(wantZh() && parts.zh && !isEnglishText(parts.zh)) seqs.push({ text: parts.zh, lang: 'zh-CN' });

      if(!seqs.length){
        // 这句没有可读内容（例如整句未翻译的中文）
        if(myToken !== token) return;
        if(single){ stopPlay('本句无可朗读内容'); return; }
        playFrom(i+1, false);
        return;
      }

      let k = 0;
      const step = function(){
        if(myToken !== token || !playing) return;
        if(k >= seqs.length){
          // 本句读完
          if(single){
            // 单句模式：读完这一句就停，不再往下
            if(myToken === token && playing) stopPlay('✅ 第 ' + (i+1) + ' 句朗读完毕');
            return;
          }
          // 连读模式 → 下一句（留一点间隔更自然）
          setTimeout(function(){
            if(myToken === token && playing && !paused) playFrom(i+1, false);
          }, engine === 'online' ? 120 : 260);
          return;
        }
        const s = seqs[k++];
        speakOne(s.text, s.lang, step);
      };
      step();
    }
  }

  function stopPlay(msg){
    token++;
    playing = false; paused = false;
    cancelWatchdog();
    try{ if(synth) synth.cancel(); }catch(e){}
    // 在线引擎：停掉当前音频
    try{
      if(curAudio){ curAudio.pause(); curAudio.onended = null; curAudio.onerror = null; curAudio = null; }
    }catch(e){}
    clearHighlight();
    syncButtons();
    setState(msg || '');
    if(!msg) updateEngineHint();
  }

  function pausePlay(){
    if(!playing) return;
    if(paused){
      // 继续
      paused = false;
      syncButtons();
      setState(singleMode ? ('第 ' + (idx+1) + ' 句') : ('朗读中 ' + (idx+1) + '/' + currentEntries.length));
      if(engine === 'online'){
        if(curAudio){ try{ curAudio.play(); }catch(e){} }
        else { playFrom(idx, false, singleMode); }
      } else {
        try{ if(synth) synth.resume(); }catch(e){}
        // 某些设备 resume 无效 → 重新读当前句
        if(synth && !synth.speaking && !synth.pending){
          playFrom(idx, false, singleMode);
        }
      }
    } else {
      paused = true;
      syncButtons();
      setState('已暂停');
      if(engine === 'online'){
        if(curAudio){ try{ curAudio.pause(); }catch(e){} }
      } else {
        try{ if(synth) synth.pause(); }catch(e){}
      }
    }
  }

  // ▶ 朗读全文：始终从头开始、连读到末尾（点句单读后再点它也能正常全文朗读）
  if(playBtn) playBtn.addEventListener('click', function(){
    if(!currentEntries.length){ setState('请先导入文章'); return; }
    playFrom(0, true, false);
  });
  if(pauseBtn) pauseBtn.addEventListener('click', pausePlay);
  if(stopBtn) stopBtn.addEventListener('click', function(){ stopPlay('已停止'); });
  // ⏮⏭：单句模式下直接单读目标句；连读模式下跳转后继续连读
  if(prevBtn) prevBtn.addEventListener('click', function(){
    if(!currentEntries.length) return;
    const t = Math.max(0, idx - 1);
    idx = t; highlight(t);
    if(playing) playFrom(t, true, singleMode);
    else if(singleMode) playFrom(t, true, true);   // 单读过的句子，⏮ 继续单读
    else setState('第 '+(t+1)+' 句（点该句即朗读）');
  });
  if(nextBtn) nextBtn.addEventListener('click', function(){
    if(!currentEntries.length) return;
    const t = Math.min(currentEntries.length-1, idx + 1);
    idx = t; highlight(t);
    if(playing) playFrom(t, true, singleMode);
    else if(singleMode) playFrom(t, true, true);   // 单读过的句子，⏭ 继续单读
    else setState('第 '+(t+1)+' 句（点该句即朗读）');
  });
  if(rateRng) rateRng.addEventListener('input', function(){
    if(rateVal) rateVal.textContent = RATE().toFixed(1) + 'x';
  });
  if(zhChk) zhChk.addEventListener('change', function(){
    // 改了是否读译文，若正在播放则从当前句重来（保持当前单读/连读模式）
    if(playing) playFrom(idx, true, singleMode);
  });
  if(loopChk) loopChk.addEventListener('change', function(){
    if(playing && loopChk.checked) setState('循环开启');
  });

  // 点击某句 = 立即从这句开始读（方便精听某一段）
  content.addEventListener('click', function(ev){
    // 点的是可点击单词 → 交给取词，不抢
    if(ev.target.classList && ev.target.classList.contains('word')) return;
    // 点在链接/按钮上也不要抢
    const tag = (ev.target.tagName || '').toLowerCase();
    if(tag === 'a' || tag === 'button') return;

    const entry = ev.target.closest ? ev.target.closest('.entry') : null;
    if(!entry) return;
    const i = Number(entry.getAttribute('data-i'));
    if(isNaN(i) || !currentEntries[i]) return;

    // 点某句 = 只朗读被点的这一句（读完即停，不往下读）
    playFrom(i, true, true);
  });

  // 语音列表是异步加载的，先触发一次
  try{
    if(synth){
      synth.getVoices();
      if(typeof synth.onvoiceschanged !== 'undefined'){
        synth.onvoiceschanged = function(){ voicesLoaded = true; };
      }
    }
  }catch(e){}

  // 启动时静默探测引擎，提前把状态显示出来（不发声）
  (async function initEngine(){
    let ok = false;
    try{ ok = await probeSystem(); }catch(e){ ok = false; }
    engine = ok ? 'system' : 'online';
    updateEngineHint();
    if(stateEl){
      stateEl.textContent = ok ? '系统语音就绪' : '在线语音（需联网）';
      stateEl.style.color = ok ? '#15803d' : '#b45309';
    }
  })();

  // 页面切到后台时停掉，避免后台乱响
  document.addEventListener('visibilitychange', function(){
    if(document.hidden && playing) stopPlay('');
  });

  // 换文章时停止朗读
  window.__ttsReset = function(){ stopPlay(''); idx = 0; };
  syncButtons();
  if(stateEl && !stateEl.textContent) setState('');
})();

async function parseAndImport(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  const buf = await file.arrayBuffer();
  let text = '';
  if(ext==='pdf') text = await extractPdfText(buf);
  else if(ext==='docx') text = await extractDocxText(buf);
  else {
    const dec = new TextDecoder('utf-8');
    text = dec.decode(buf);
    return loadTextFile(text, file.name);
  }
  const entries = entriesFromDoc(text);
  if(!entries.length) throw new Error('未能从「'+file.name+'」提取到中文或英文（可能是扫描版/图片型 PDF，需先 OCR）。');
  renderBilingual(entries);
  status.textContent = '已解析「'+file.name+'」：共 '+entries.length+' 句（'+dirSummary(entries)+'）。点击蓝色英文单词可取词。';
  const wantTr = document.getElementById('autoTr') && document.getElementById('autoTr').checked;
  if(wantTr){
    showBanner('info','已导入 '+entries.length+' 句（'+dirSummary(entries)+'），正在后台逐句翻译…');
    const done = await translateEntries(entries);
    showBanner(done>0?'ok':'warn',
      done>0 ? '已翻译 '+done+'/'+entries.length+' 句。':translateFailHint());
  } else {
    showBanner('ok','已导入「'+file.name+'」共 '+entries.length+' 句（'+dirSummary(entries)+'）。<br>勾选「导入时联网自动翻译」可生成译文。');
  }
}

// ===================== 远程更新（内置版本检查 / 热更新） =====================
// 调用原生 UpdateManager 插件。插件把 update.json 从本仓库拉取并处理。
(function(){
  const updateBtn = document.getElementById('updateBtn');
  if(!updateBtn) return;

  // 用一个通用桥接调用原生插件
  async function callPlugin(pluginId, method, opts){
    const cap = capBridge();
    if(!cap || typeof cap.nativePromise !== 'function'){
      throw new Error('当前环境不支持原生插件（非独立 App 或插件未注册）');
    }
    try{
      return await cap.nativePromise(pluginId, method, (opts || {}));
    }catch(err){
      // 原生 reject 过来的可能是 Exception 对象，尽量取出可读信息
      let m = '';
      if(err){
        if(typeof err === 'string') m = err;
        else m = err.message || err.errorMessage || '';
      }
      // Capacitor 有时把 "plugin not implemented" 之类包一层
      if(/not implemented/i.test(m)) m = '更新模块未生效，请安装 v1.3 或更新版本';
      throw new Error(m || '未知错误');
    }
  }

  // 判断是不是"网络不通"类错误，给出更具体的建议
  function netHint(msg){
    if(/所有更新地址都无法访问|timeout|timed out|超时|Unable to resolve host|UnknownHost|ConnectException|SSL/i.test(msg||'')){
      return '<br><span style="opacity:.85">可能原因：当前网络访问 GitHub 受限。'
           + '请换用 Wi-Fi / 手机热点再试；或稍后再点一次。</span>';
    }
    return '';
  }

  async function checkUpdate(showLatest){
    updateBtn.textContent = '检查中…';
    updateBtn.disabled = true;
    try{
      const r = await callPlugin('UpdateManager', 'check', {});
      const state = r && (r.state || 'none');
      const msg = (r && r.message) || '';
      if(state === 'none'){
        showBanner('ok', '🟢 ' + esc(msg) + (r.source ? '　<i style="opacity:.7">（' + esc(r.source) + '）</i>' : ''));
        hideBannerSoon(5000);
      } else {
        // 有更新：提供升级选项
        const acts = [];
        // 网页内容热更新（只要清单里带 files 就允许，重新应用当前版也无害）
        acts.push({label:'仅更新应用内容（热更新）', onClick: applyWebUpdate});
        if(r.hasApk){
          acts.push({label:'下载新版 App（整包安装）', onClick: installAppUpdate});
        }
        if(!acts.length) acts.push({label:'知道了', onClick: hideBanner});
        showBanner('info', '🔵 '+esc(msg)+'<br>请问如何更新？', acts);
      }
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '检查更新失败：'+esc(m)+netHint(m));
    }finally{
      updateBtn.textContent = '🔄 更新';
      updateBtn.disabled = false;
    }
  }

  async function applyWebUpdate(){
    showBanner('info', '正在下载并应用应用内容更新…');
    try{
      const r = await callPlugin('UpdateManager', 'applyWeb', {});
      if(r && r.skipped){
        showBanner('ok', '🟢 已经是当前最新内容（v'+(r.webVersion||'')+'），无需更新。');
        return;
      }
      showBanner('ok', '✅ 应用内容已更新为最新版。');
      setTimeout(()=>{ location.reload(); }, 1500);
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '应用内容更新失败：'+esc(m)+netHint(m));
    }
  }

  async function installAppUpdate(){
    showBanner('info', '正在下载新版 App…下载完成后会弹出系统安装界面。');
    try{
      await callPlugin('UpdateManager', 'installApp', {});
      showBanner('ok', '已开始下载并安装新版 App，请按系统提示操作。');
    }catch(e){
      const m = e && e.message ? e.message : '未知错误';
      showBanner('err', '下载新版 App 失败：'+esc(m)+netHint(m));
    }
  }

  function hideBannerSoon(ms){ setTimeout(()=>{ if(bannerEl.className.includes('banner')) hideBanner(); }, ms); }

  updateBtn.addEventListener('click', function(){ checkUpdate(true); });
})();
</script>
