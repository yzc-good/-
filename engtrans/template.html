<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语翻译助手 · English Translator</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1e2430; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eef4ff; --line:#e5e9f0;
  --en:#1f2937; --zh:#b45309; --hl:#fff7e6; --ok:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
header{background:linear-gradient(120deg,#1d4ed8,#2563eb);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
header .logo{font-size:26px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:2px}
.header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.28)}
main{padding:22px 28px;display:flex;gap:20px;align-items:flex-start}
.left{flex:1;min-width:0}
.right{width:340px;position:sticky;top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:#fafbfe}
.toolbar label{font-size:12px;color:var(--muted);margin-right:4px}
.toolbar select,.toolbar input[type=file],.toolbar button{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.toolbar button.primary{background:var(--accent);color:#fff;border:none;font-weight:600}
.toolbar .spacer{flex:1}
.body{padding:18px}
.entry{margin-bottom:26px;border-bottom:1px dashed var(--line);padding-bottom:18px}
.entry:last-child{border-bottom:none}
.en{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.zh{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
/* 中→英：第一行中文原文（无底色），第二行英文译文（黄底，单词仍可点） */
.src-zh{font-size:17px;line-height:1.7;color:var(--en);font-weight:500}
.tr{font-size:16px;line-height:1.7;color:var(--zh);margin-top:8px;background:var(--hl);padding:8px 12px;border-radius:8px}
.tr.pending{color:#b45309;opacity:.75;font-style:italic}
/* 词典内查词：输入英文或中文 */
.dict-search{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}
.dict-search input{flex:1 1 auto;min-width:0;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafbfe;color:var(--ink)}
.dict-search input:focus{outline:none;border-color:#93c5fd;background:#fff}
.dict-search button{flex:0 0 auto;font-size:13px;padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.term-line{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:#f6faf7;flex:0 0 auto}
.term-line button{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border:none;border-radius:8px;background:#15803d;color:#fff;font-weight:600;cursor:pointer}
.term-line button:hover{opacity:.9}
.term-line .term-note{font-size:11px;color:#6b7280;line-height:1.4;min-width:0}
@media (max-width:520px){ .term-line{flex-direction:column;align-items:flex-start;gap:4px} }
/* 术语在线权威卡片 */
.termcard{border-left:3px solid #15803d;background:#f7fdf9}
.termcard .dword{color:#14532d}
.termbadge{display:inline-block;font-size:10.5px;color:#15803d;background:#dcfce7;
  border-radius:20px;padding:2px 9px;margin:6px 0 2px}
.word{color:#1d4ed8;cursor:pointer;border-radius:3px;transition:background .1s;padding:0 1px}
.word:hover{background:#dbeafe}
.word.active{background:#fde68a}
.legend{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.legend b{font-weight:600}
/* dictionary panel */
.dict-panel h3{font-size:15px;padding:14px;background:var(--accent-soft);color:var(--accent);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dict-body{padding:0;max-height:70vh;overflow:auto}
.dict-empty{padding:28px 18px;color:var(--muted);font-size:13px;text-align:center}
.dict-card{padding:16px;border-bottom:1px solid var(--line)}
.dict-card.hit{background:#fffbeb}
.dword{font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.dipa{font-size:14px;color:var(--muted);font-weight:400}
.dpos{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 8px;margin:8px 0 6px}
.dmean{font-size:14.5px;line-height:1.6;color:var(--ink)}
.dpos2{display:inline-block;font-size:11px;font-style:italic;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.dmean .e{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.dex{font-size:13px;color:var(--ok);background:#f0fdf4;border-radius:6px;padding:7px 10px;margin-top:10px;line-height:1.5}
.dsyn{margin-top:9px;font-size:12.5px;color:var(--muted)}
.dsyn b{color:var(--ink)}
.dnotes{font-size:12.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.dfunc{font-size:13.5px;color:var(--ink);line-height:1.6}
.status{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);background:#fafbfe}
.loading{text-align:center;color:var(--muted);padding:30px}
.copy-btn{cursor:pointer}
/* 顶部状态横幅 */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 22px;font-size:14px;line-height:1.65;border-bottom:1px solid rgba(0,0,0,.07)}
.banner[hidden]{display:none}
.banner .ico{font-size:16px;line-height:1.4}
.banner .msg{flex:1;min-width:0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.banner button{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:#fff;cursor:pointer}
.banner button.pri{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}
.banner .x{margin-left:auto;cursor:pointer;opacity:.5;font-size:16px;line-height:1;background:none;border:none;padding:0 4px}
.banner.ok{background:#ecfdf5;color:#065f46;border-bottom-color:#a7f3d0}
.banner.warn{background:#fffbeb;color:#92400e;border-bottom-color:#fde68a}
.banner.err{background:#fef2f2;color:#991b1b;border-bottom-color:#fecaca}
.banner.info{background:#eff6ff;color:#1e40af;border-bottom-color:#bfdbfe}
.banner code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;font-size:12.5px}
.zh.pending{color:#b45309;opacity:.75;font-style:italic}
/* 未收录词条的兜底按钮 */
a.linkbtn,button.linkbtn{display:inline-block;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;cursor:pointer;text-decoration:none}
a.linkbtn:hover,button.linkbtn:hover{background:#e0e7ff}
.dmiss{color:#6b7280;font-size:13.5px;line-height:1.7;margin-top:6px}
.dmiss b{color:#b45309}
@media(max-width:820px){main{flex-direction:column}.right{width:100%;position:static}}
</style>
</head>
<body>

<header>
  <div class="logo">🈶</div>
  <div>
    <h1>英语翻译助手</h1>
    <p>中英双向互译 · 逐行对照 · 点击取词 · 本地离线可用</p>
  </div>
  <div class="header-right">
    <button class="btn" id="openDictBtn" title="输入英文或中文查词">🔍 查词</button>
    <button class="btn" onclick="window.print()">🖨 打印</button>
  </div>
</header>

<div class="banner info" id="banner" hidden>
  <span class="ico" id="bannerIco">ℹ️</span>
  <div class="msg" id="bannerMsg"></div>
  <button class="x" onclick="hideBanner()" title="关闭">✕</button>
</div>

<main>
  <div class="left">
    <div class="card">
      <div class="toolbar">
        <label>导入文档</label>
        <input type="file" id="fileInput" accept=".txt,.md,.html,.pdf,.docx,.doc,application/pdf" title="支持中文或英文文档，自动识别方向">
        <button class="primary" onclick="loadBundled()">📄 载入内置文档</button>
        <div class="spacer"></div>
        <label><input type="checkbox" id="autoTr" style="vertical-align:middle"> 导入时联网自动翻译</label>
        <label>取词方式</label>
        <select id="modeSel" onchange="setMode(this.value)">
          <option value="click">点击取词</option>
          <option value="hover">悬停取词</option>
        </select>
      </div>
      <div class="body" id="content">
        <div class="loading">正在加载…</div>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <aside class="right">
    <div class="card dict-panel">
      <h3>📖 词典 · 点击下方英文单词查看释义</h3>
      <div class="dict-search">
        <input type="search" id="dictSearch" enterkeyhint="search" autocomplete="off"
               placeholder="输入英文或中文，如 extinction / 灭绝">
        <button id="dictSearchBtn" title="查词">查</button>
      </div>
      <div class="term-line">
        <button id="termOnlineBtn" title="跳转到术语在线，查询权威科技术语">🔬 术语在线（科学术语权威）</button>
        <span class="term-note">联网后，可直接在「术语在线」查标准译名（全国科技术语委）</span>
      </div>
      <div class="dict-body" id="dictBody">
        <div class="dict-empty">点击左侧任意英文单词，这里会显示它在牛津词典中的释义。</div>
      </div>
      <div class="status">词库内置本篇所有关键词；任意单词点击均会尽力解析。</div>
    </div>
  </aside>
</main>

<script>
/*__DATA__*/

const DATA = window.APP_DATA;
const dictBody = document.getElementById('dictBody');
const content = document.getElementById('content');
const status = document.getElementById('status');

// ---------- data lookup ----------
function normKey(w){ return w.toLowerCase(); }

function lookup(word){
  // try several normalized forms of the word
  const candidates = forms(word);
  for(const c of candidates){
    const k = normKey(c.w);
    let res = lookupOne(k, c.w);
    if(res && res.entry) return res;
  }
  return null;
}

// generate candidate (raw word, normalized key) forms
function forms(word){
  let w = word.trim();
  const out = [{w:w, note:''}];
  // possessive 's / s' 
  if(/'\w*$/.test(w)){
    out.push({w: w.replace(/'s$/,''), note:'〔所有格 -\'s〕'});
    out.push({w: w.replace(/'$/, ''), note:'〔-s\' 复数所有格〕'});
    out.push({w: w.replace(/s'$/,'s'), note:''});
  }
  // contractions: don't -> do not, can't -> can, won't -> will, it's -> it is
  const c1 = {
    "don't":"do not","can't":"can not","won't":"will not","shan't":"shall not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "hasn't":"has not","haven't":"have not","hadn't":"had not",
    "doesn't":"does not","didn't":"did not","it's":"it is","that's":"that is",
    "there's":"there is","i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would",
    "we're":"we are","we've":"we have","we'll":"we will","you're":"you are",
    "you've":"you have","you'll":"you will","they're":"they are","they've":"they have",
    "he's":"he is","she's":"she is","who's":"who is","what's":"what is",
    "let's":"let us","wouldn't":"would not","couldn't":"could not",
    "shouldn't":"should not","mustn't":"must not",
  };
  const lk = normKey(w);
  if(c1[lk]){ out.push({w: c1[lk], note:'〔缩写 '+w+' → '+c1[lk]+'〕'}); }
  return out;
}

function lookupOne(k, word){
  // direct
  if(DATA.dictionary[k]) {
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k]));
    e.headword = word + (normKey(word)!==k && /^[a-z]/i.test(word) && word.toLowerCase()!==k && !DATA.dictionary[normKey(word)] ? '（' + e.headword + '）' : '');
    return {entry:e, word};
  }
  // function word
  if(DATA.funcWords && DATA.funcWords[k]) {
    return {entry:{headword:word, ipa:'', pos:[],
      meanings:[{zh:DATA.funcWords[k], en:''}],
      example:'', notes:'常用功能词 / function word'}, word};
  }
  // inflection -> base
  if(DATA.inflect && DATA.inflect[k]) {
    const base = DATA.inflect[k];
    if(DATA.dictionary[base]){
      const e = JSON.parse(JSON.stringify(DATA.dictionary[base]));
      e.headword = word + '（' + e.headword + '）';
      return {entry:e, word};
    }
    if(DATA.funcWords[base]){
      return {entry:{headword:word+'（'+base+'）', ipa:'', pos:[],
        meanings:[{zh:DATA.funcWords[base], en:''}], example:'', notes:'常用词'}, word};
    }
  }
  // trivial depluralize
  if(k.endsWith('s') && DATA.dictionary[k.slice(0,-1)]){
    const e = JSON.parse(JSON.stringify(DATA.dictionary[k.slice(0,-1)]));
    e.headword = word + '（' + e.headword + '）';
    return {entry:e, word};
  }
  return {entry:null, word};
}

// render dictionary entry
function renderDict(entry, word){
  if(!entry){
    const w = String(word || '').trim();
    const q = encodeURIComponent(w.toLowerCase());
    dictBody.innerHTML =
      '<div class="dict-card hit">' +
        '<div class="dword">' + esc(w) + '</div>' +
        '<div class="dmiss">本地词库暂未收录 <b>' + esc(w) + '</b>。<br>可点下面按钮在线查询：</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
          '<a class="linkbtn" target="_blank" rel="noopener" ' +
             'href="https://www.oxfordlearnersdictionaries.com/definition/english/' + q + '">📖 牛津在线词典</a>' +
          '<button class="linkbtn" id="wordOnlineBtn">🌐 联网查词（多义）</button>' +
        '</div>' +
        '<div class="dex" id="wordOnlineOut" style="display:none"></div>' +
      '</div>';
    const btn = dictBody.querySelector('#wordOnlineBtn');
    if(btn) btn.addEventListener('click', function(){ wordOnline(w); });
    return;
  }
  let hits = 0;
  let html = '<div class="dict-card hit">';
  html += '<div class="dword">'+esc(entry.headword)+' <span class="dipa">'+esc(entry.ipa||'')+'</span></div>';
  (entry.pos||[]).forEach(p=>{ if(p) html += '<span class="dpos">'+esc(p)+'</span>'; });
  (entry.meanings||[]).forEach(m=>{
    if(m.pos){
      html += '<div class="dmean"><span class="dpos2">'+esc(m.pos)+'</span>'+esc(m.zh)+(m.en?'<span class="e">'+esc(m.en)+'</span>':'')+'</div>';
    } else {
      html += '<div class="dmean">'+esc(m.zh)+(m.en?'<span class="e">'+esc(m.en)+'</span>':'')+'</div>';
    }
  });
  if(entry.example) html += '<div class="dex">✎ '+esc(entry.example)+'</div>';
  if(entry.syn) html += '<div class="dsyn"><b>同义词</b> '+entry.syn.map(esc).join(', ')+'</div>';
  if(entry.ant) html += '<div class="dsyn"><b>反义词</b> '+entry.ant.map(esc).join(', ')+'</div>';
  if(entry.notes) html += '<div class="dnotes">💡 '+esc(entry.notes)+'</div>';
  html += '</div>';
  dictBody.innerHTML = html;
}

// ---------- 词典内查词：英→中 / 中→英（均支持一词多义） ----------
let _zhIndex = null;      // 中文释义 → 英文单词（首次查询时构建）

function stripZhNote(s){
  return String(s||'')
    .replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'')
    .replace(/\[[^\]]*\]/g,'');
}

function zhTerms(s){
  return stripZhNote(s)
    .split(/[；;，,、\/|]+/)
    .map(x=>x.replace(/^(的|地|得|使|把|被)/,'').trim())
    .filter(x=>x && x.length<=10);
}

function buildZhIndex(){
  if(_zhIndex) return _zhIndex;
  const idx = new Map();
  const push = (term, w)=>{
    let arr = idx.get(term);
    if(!arr){ arr = []; idx.set(term, arr); }
    if(arr.indexOf(w) < 0) arr.push(w);
  };
  const dict = DATA.dictionary || {};
  Object.keys(dict).forEach(w=>{
    (dict[w].meanings||[]).forEach(m=>{ zhTerms(m.zh).forEach(t=>push(t, w)); });
  });
  const fw = DATA.funcWords || {};
  Object.keys(fw).forEach(w=>{ zhTerms(fw[w]).forEach(t=>push(t, w)); });
  _zhIndex = idx;
  return idx;
}

function searchZh(q){
  const key = String(q||'').trim();
  if(!key) return [];
  if(key.length > 12) return [];
  const idx = buildZhIndex();

  const exact = idx.get(key);
  if(exact && exact.length) return exact.slice(0, 30);

  const allowReverse = key.length <= 4;
  const loose = [];
  for(const pair of idx){
    const term = pair[0];
    let hit = term.indexOf(key) >= 0;
    if(!hit && allowReverse && term.length >= 2) hit = key.indexOf(term) >= 0;
    if(hit){
      pair[1].forEach(w=>{ if(loose.indexOf(w) < 0) loose.push(w); });
      if(loose.length >= 40) break;
    }
  }
  return loose;
}

function renderSearchList(q, words){
  let html = '<div class="dict-card hit"><div class="dword">🔍 '+esc(q)+'</div>'+
             '<div class="dnotes">在本地词库找到 '+words.length+' 个相关词条</div></div>';
  words.slice(0, 12).forEach(w=>{
    const e = (DATA.dictionary || {})[w];
    html += '<div class="dict-card">';
    if(e){
      html += '<div class="dword">'+esc(e.headword || w)+' <span class="dipa">'+esc(e.ipa||'')+'</span></div>';
      (e.meanings||[]).forEach(m=>{
        html += '<div class="dmean">' + (m.pos?'<span class="dpos2">'+esc(m.pos)+'</span>':'') + esc(m.zh) + '</div>';
      });
      if(e.example) html += '<div class="dex">✎ '+esc(e.example)+'</div>';
    }else{
      html += '<div class="dword">'+esc(w)+'</div>' +
              '<div class="dmean">'+esc((DATA.funcWords||{})[w] || '')+'</div>';
    }
    html += '</div>';
  });
  dictBody.innerHTML = html;
}

function renderOnlineSenses(word, d){
  let h = '<div class="dict-card hit">' +
          '<div class="dword">'+esc(word)+' <span class="dipa">'+esc(d.ipa||'')+'</span></div>' +
          '<div class="dnotes">联网查询（按词性分组，一词多义）</div>';
  (d.senses||[]).forEach(s=>{
    h += '<div class="dmean">' + (s.pos?'<span class="dpos2">'+esc(s.pos)+'</span> ':'') + esc(s.zh) + '</div>';
  });
  h += '</div>';
  dictBody.innerHTML = h;
}

// ---------- 术语在线：权威科技术语（全国科技术语委） ----------
// 使用术语在线公开的 drawWordSearch 接口（匿名可用、CORS 开放）。
// 仅为「用户当前查的这一个词」实时查询，不做批量抓取。
async function fetchTermOnline(term){
  const q = String(term || '').trim();
  if(!q) return null;
  const url = 'https://www.termonline.cn/main-serve/business/tm/tmWord/drawWordSearch?term=' +
              encodeURIComponent(q);
  try{
    const ctrl = new AbortController();
    const tid = setTimeout(function(){ ctrl.abort(); }, 9000);
    const r = await fetch(url, {
      headers: { 'Accept':'application/json, text/plain, */*' },
      signal: ctrl.signal
    });
    clearTimeout(tid);
    const j = await r.json();
    const res = (j && j.result) || null;
    if(!res || (!res.cn && !res.en)) return null;
    return res;
  }catch(e){
    return null;
  }
}

function termCardHtml(r){
  const title = (r.cn || '') && (r.en || '') ? (r.cn + ' = ' + r.en)
              : (r.cn || r.en || '');
  const subj = r.subjectFullName || r.subjectName || '';
  let h = '<div class="dict-card termcard">' +
          '<div class="dword">🔬 ' + esc(title) + '</div>' +
          '<div class="termbadge">全国科技术语委 · 术语在线' + (subj ? ' · ' + esc(subj) : '') + '</div>';
  const meta = [];
  if(r.source) meta.push('来源：《' + esc(r.source) + '》');
  if(r.publishYear) meta.push('发布：' + esc(r.publishYear) + ' 年');
  if(r.wordNumber) meta.push('编号：' + esc(r.wordNumber));
  if(meta.length) h += '<div class="dnotes">' + meta.join(' · ') + '</div>';

let _searchSeq = 0;
async function dictSearch(raw){
  const q = String(raw || '').trim();
  if(!q) return;
  const seq = ++_searchSeq;
  const isCJK = /[\u3400-\u9fff\uf900-\ufaff]/.test(q);

  if(!isCJK){
    const res = lookup(q);
    const termP = fetchTermOnline(q);

    if(res && res.entry){
      renderDict(res.entry, q);
      termP.then(function(t){
        if(seq !== _searchSeq || !t) return;
        const card = document.createElement('div');
        card.innerHTML = termCardHtml(t);
        const node = card.firstElementChild;
        if(node) dictBody.appendChild(node);
        bindTermMore(t);
      });
      return;
    }

    dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
      '<div class="dmiss">本地词库未收录，正在查询术语在线…</div></div>';
    try{
      const t = await termP;
      if(seq === _searchSeq && t){
        dictBody.innerHTML = termCardHtml(t);
        bindTermMore(t);
        return;
      }
    }catch(e){}
    dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
      '<div class="dmiss">术语在线未收录，正在联网查询…</div></div>';
    try{
      const r = await fetchWithTimeout(SERVER_BASE + '/api/word?w=' + encodeURIComponent(q), {}, 20000);
      const dd = await r.json();
      if(seq === _searchSeq && dd && dd.ok && dd.senses && dd.senses.length){
        renderOnlineSenses(q, {ipa: dd.ipa, senses: dd.senses});
        return;
      }
    }catch(e){}
    if(seq === _searchSeq) renderDict(null, q);
    return;
  }

  const words = searchZh(q);
  const termPZh = fetchTermOnline(q);
  if(words.length){
    renderSearchList(q, words);
    termPZh.then(function(t){
      if(seq !== _searchSeq || !t) return;
      const card = document.createElement('div');
      card.innerHTML = termCardHtml(t);
      const node = card.firstElementChild;
      if(node) dictBody.appendChild(node);
      bindTermMore(t);
    });
    return;
  }

  dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
    '<div class="dmiss">本地词库没有「'+esc(q)+'」，正在查询术语在线…</div></div>';
  try{
    const t = await termPZh;
    if(seq === _searchSeq && t){
      dictBody.innerHTML = termCardHtml(t);
      bindTermMore(t);
      return;
    }
  }catch(e){}

  dictBody.innerHTML = '<div class="dict-card"><div class="dword">'+esc(q)+'</div>'+
    '<div class="dmiss">术语在线未收录，正在联网翻译成英文…</div></div>';
  try{
    const r = await fetchWithTimeout(SERVER_BASE + '/api/translate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: q})
    }, 30000);
    const data = await r.json();
    const first = (data && data.ok && data.entries && data.entries[0]) || null;
    const en = first ? String(first.en || '').trim() : '';
    if(seq === _searchSeq && en){
      const clean = en.replace(/[.。,，;；!！?？]+$/,'').trim();
      const word = clean.split(/\s+/).filter(Boolean)[0] || '';
      const res = word ? lookup(word) : null;
      let html = '<div class="dict-card hit"><div class="dword">'+esc(q)+'</div>'+
                 '<div class="dmean">→ '+esc(clean)+'</div>'+
                 '<div class="dnotes">联网翻译结果</div></div>';
      if(res && res.entry){
        html += '<div class="dict-card">'+
                '<div class="dword">'+esc(res.entry.headword)+' <span class="dipa">'+esc(res.entry.ipa||'')+'</span></div>';
        (res.entry.meanings||[]).forEach(m=>{
          html += '<div class="dmean">' + (m.pos?'<span class="dpos2">'+esc(m.pos)+'</span>':'') + esc(m.zh) + '</div>';
        });
        html += '</div>';
      }
      dictBody.innerHTML = html;
      return;
    }
  }catch(e){}
  if(seq === _searchSeq){
    dictBody.innerHTML = '<div class="dict-card hit"><div class="dword">'+esc(q)+'</div>'+
      '<div class="dmiss">没有查到「'+esc(q)+'」。中文查英文需要本地服务在运行。</div></div>';
  }
}

function tokenize(text){
  // split into word / non-word tokens
  const parts = text.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g);
  let out = '';
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    if(!p) continue;
    if(/^[A-Za-z]/.test(p)){
      out += '<span class="word" data-w="'+esc(normKey(p))+'">'+esc(p)+'</span>';
    } else {
      out += esc(p);
    }
  }
  return out;
}

// ---------- 中英方向识别与按行切分 ----------
function detectDir(s){
  const t = String(s || '');
  const cjk = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
  const lat = (t.match(/[A-Za-z]/g) || []).length;
  if(cjk === 0) return 'en2zh';
  if(lat === 0) return 'zh2en';
  return (cjk * 2 >= lat) ? 'zh2en' : 'en2zh';
}

function isNoiseLine(ln){
  const t = String(ln || '').trim();
  if(!t) return true;
  if(/^change\s+times/i.test(t) || /粉丝团/.test(t)) return true;
  if(/^[\d\s.\-–—|/]+$/.test(t)) return true;
  if(/^第\s*[0-9０-９一二三四五六七八九十百千]+\s*页\s*$/.test(t)) return true;
  if(/^page\s*\d+(\s*(of|\/)\s*\d+)?$/i.test(t)) return true;
  if(/^\d+\s*\/\s*\d+$/.test(t)) return true;
  return false;
}

// 纯文本按行切分（中文行按句号再切）
function entriesFromLines(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(ln=>{
    ln = ln.trim();
    if(isNoiseLine(ln)) return;
    const d = detectDir(ln);
    if(d === 'zh2en'){
      ln.split(/(?<=[。！？；])/).forEach(p=>{
        p = p.trim();
        if(p && /[\u4e00-\u9fff]/.test(p)) out.push({en:'', zh:p, dir:'zh2en'});
      });
    } else if(/[A-Za-z]{2,}/.test(ln)){
      out.push({en:ln, zh:'', dir:'en2zh'});
    }
  });
  return out;
}

function dirSummary(entries){
  let z = 0, e = 0;
  entries.forEach(x=>{ if((x.dir || 'en2zh') === 'zh2en') z++; else e++; });
  if(z && e) return '中→英 ' + z + ' 行 / 英→中 ' + e + ' 行';
  return z ? '中文 → 英文' : '英文 → 中文';
}

function fetchWithTimeout(url, opts, ms){
  return new Promise((resolve, reject)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); reject(new Error('请求超时（'+Math.round(ms/1000)+'秒）')); }, ms);
    fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
      .then(r=>{ clearTimeout(timer); resolve(r); })
      .catch(e=>{ clearTimeout(timer); reject(e); });
  });
}

// 通过本地服务解析文档（先只要英文，快速返回）
async function extractViaServer(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const buf = await file.arrayBuffer();
  const url = SERVER_BASE + '/api/import?ext='+encodeURIComponent(ext)+'&translate=0';
  const resp = await fetchWithTimeout(url, {
    method:'POST',
    headers:{'Content-Type':'application/octet-stream'},
    body: buf
  }, 120000);
  if(!resp.ok) throw new Error('服务返回 '+resp.status);
  const data = await resp.json();
  if(!data.ok) throw new Error(data.error || '解析失败');
  return data;
}

// ---------- 逐批翻译（服务端按方向分组、多行合并） ----------
function srcOf(e){ return (e.dir === 'zh2en') ? (e.zh || '') : (e.en || ''); }
function setTrans(e, t){ if(e.dir === 'zh2en') e.en = t; else e.zh = t; }
function hasTrans(e){ return e.dir === 'zh2en' ? !!e.en : !!e.zh; }

async function translateEntries(entries){
  const BATCH = 10;
  let done = 0;
  for(let i=0;i<entries.length;i+=BATCH){
    const chunk = entries.slice(i, i+BATCH);
    try{
      const resp = await fetchWithTimeout(SERVER_BASE + '/api/translate-lines', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          lines: chunk.map(e=> srcOf(e)),
          dirs:  chunk.map(e=> e.dir || 'en2zh')
        })
      }, 60000);
      const data = await resp.json();
      const arr = (data && (data.trans || data.zh)) || [];
      if(Array.isArray(arr)){
        arr.forEach((t,k)=>{
          if(t){ setTrans(entries[i+k], t); updateTr(i+k, t); done++; }
        });
      }
    }catch(err){
      // 网络不可用就停止，保留原文
      break;
    }
    showBanner('info', '正在翻译… 已完成 <b>'+done+' / '+entries.length+'</b> 句');
  }
  return done;
}

// 更新第 idx 条的译文（自动适配方向）
function updateTr(idx, text){
  const el = content.querySelector('[data-tr="'+idx+'"]');
  if(!el) return;
  el.classList.remove('pending');
  const e = currentEntries[idx];
  if(e && (e.dir || 'en2zh') === 'zh2en'){
    el.innerHTML = tokenize(text);
    bindWordClicks(el);
  } else {
    el.textContent = text;
  }
}

document.getElementById('fileInput').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  e.target.value = '';

  if(ext === 'doc'){
    showBanner('warn', '旧版 <b>.doc</b> 暂不支持，请在 Word 中另存为 <b>.docx</b> 或 <b>.pdf</b> 后再导入。');
    return;
  }

  // 文本类：浏览器直接读
  if(ext !== 'pdf' && ext !== 'docx'){
    const reader = new FileReader();
    reader.onload = function(ev){ loadTextFile(String(ev.target.result), file.name); };
    reader.readAsText(file);
    return;
  }

  // PDF / DOCX：需要本地服务
  const ok = await checkBackend();
  if(!ok){
    offlineBanner();
    return;
  }

  const wantTr = document.getElementById('autoTr') && document.getElementById('autoTr').checked;
  showBanner('info', '正在解析「<b>'+esc(file.name)+'</b>」…');
  try{
    const data = await extractViaServer(file);
    if(!data.entries || !data.entries.length){
      showBanner('warn', '未能从「<b>'+esc(file.name)+'</b>」中提取到中文或英文文本。<br>可能是扫描版/图片型 PDF（没有文字层），需要先 OCR 转成文字。');
      return;
    }
    const entries = data.entries.map(x=>({
      en: x.en || '', zh: x.zh || '', dir: x.dir || 'en2zh'
    }));
    renderBilingual(entries);   // 先秒出原文
    status.textContent = '已解析「'+file.name+'」：共 '+data.sentences+' 句（'+dirSummary(entries)+'）。';
    if(wantTr){
      showBanner('info', '已导入 '+data.sentences+' 句（'+dirSummary(entries)+'），正在后台逐句翻译…（可先阅读原文，译文会自动填入）');
      const done = await translateEntries(entries);
      if(done > 0){
        showBanner('ok', '已完成：「<b>'+esc(file.name)+'</b>」共 '+data.sentences+' 句，已翻译 '+done+' 句。点击任意英文单词可取词。');
      } else {
        showBanner('warn', '原文已导入（'+data.sentences+' 句），但联网翻译失败（可能无网络）。原文与点击取词不受影响。');
      }
    } else {
      showBanner('ok', '已导入「<b>'+esc(file.name)+'</b>」共 '+data.sentences+' 句（'+dirSummary(entries)+'）。<br>勾选「导入时联网自动翻译」后重新导入即可获得译文。');
    }
  }catch(err){
    showBanner('err', '解析失败：'+esc(err.message)+'<br>请确认本地服务仍在运行（<code>http://127.0.0.1:8338</code>）。',
      [{label:'重试连接', onClick: async ()=>{ if(await checkBackend()){ showBanner('info','服务正常，请重新选择文件'); } else { offlineBanner(); } }}]);
  }
});

// init
(async function initNotice(){
  const ok = await checkBackend();
  if(!ok){
    offlineBanner();
  } else {
    showBanner('ok', '已连接本地服务，可直接导入 <b>PDF / Word / TXT</b>。点击任意英文单词可取词。');
    setTimeout(()=>{ if(bannerEl.className.includes('banner ok')) hideBanner(); }, 6000);
  }
})();
loadBundled();
</script>
